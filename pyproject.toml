[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.2", "packaging", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-attention"
version = "0.4.0"
description = "Lite Attention: Temporal Sparse Attention for Video Diffusion Models"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Unix",
]
dependencies = [
    "torch>=2.2",
    "einops",
    "structlog",
    "tomli-w",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv]
no-build-isolation-package = ["lite-attention"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = ["pytest"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
