[build-system]
requires = ["setuptools>=64", "wheel", "torch>=2.2", "packaging", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-attention"
dynamic = ["version"]
description = "Lite Attention: Temporal Sparse Attention for Video Diffusion Models"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
    "einops",
    "structlog",
    "tomli-w",
]


[dependency-groups]
dev = ["pytest"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
