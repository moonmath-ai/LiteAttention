# Manually trigger a single wheel build with arbitrary parameters.
# Uses the same _build.yml template as the Release workflow.
name: Manual Build

on:
  workflow_dispatch:
    inputs:
      docker-image:
        description: "Docker image for build (e.g. nvidia/cuda:12.9.1-devel-ubuntu22.04)"
        required: true
        default: "nvidia/cuda:12.9.1-devel-ubuntu22.04"
        type: string
      python-version:
        description: "Python version"
        required: true
        default: "3.10"
        type: string
      cuda-version:
        description: "CUDA version (e.g. 12.8.1, 12.9.1)"
        required: true
        default: "12.9.1"
        type: string
      torch-version:
        description: "PyTorch version (e.g. 2.8.0, 2.9.1)"
        required: true
        default: "2.8.0"
        type: string
      cxx11_abi:
        description: "C++11 ABI (TRUE or FALSE)"
        required: true
        default: "FALSE"
        type: choice
        options:
          - "TRUE"
          - "FALSE"
      runner-labels-json:
        description: "Runner labels JSON (e.g. [\"self-hosted\",\"Linux\"])"
        required: false
        default: "[\"self-hosted\",\"Linux\"]"
        type: string
      run-wheel-tests:
        description: "Install built wheel and run lite_attention tests"
        required: false
        default: true
        type: boolean
      wheel-test-target:
        description: "Pytest target for wheel validation"
        required: false
        default: "hopper/tests/test_lite_attention.py"
        type: string
      build-max-jobs:
        description: "Optional override for MAX_JOBS in the wheel build"
        required: false
        default: ""
        type: string
      nvcc-threads:
        description: "Optional override for NVCC_THREADS in the wheel build"
        required: false
        default: ""
        type: string
      nvcc-lineinfo:
        description: "Optional override for LITE_ATTENTION_NVCC_LINEINFO"
        required: false
        default: ""
        type: string
      nvcc-resource-usage:
        description: "Optional override for LITE_ATTENTION_NVCC_RESOURCE_USAGE"
        required: false
        default: ""
        type: string
      nvcc-split-compile:
        description: "Optional override for LITE_ATTENTION_NVCC_SPLIT_COMPILE"
        required: false
        default: ""
        type: string
      skip-nvcc-gen-dependencies:
        description: "Optional override for LITE_ATTENTION_SKIP_NVCC_GEN_DEPENDENCIES"
        required: false
        default: ""
        type: string
      enable-ccache:
        description: "Enable ccache restore/save and bundle artifact"
        required: false
        default: true
        type: boolean
      ccache-namespace:
        description: "Namespace segment for ccache keys"
        required: false
        default: "manual-build"
        type: string
      import-ccache-artifact:
        description: "Optional artifact name containing ccache-bundle.tar.zst to import before build"
        required: false
        default: ""
        type: string
      import-ccache-bundle-path:
        description: "Optional direct path to a ccache-bundle.tar.zst file (useful for act/local testing)"
        required: false
        default: ""
        type: string
      upload-to-release:
        description: "Upload wheel to a release"
        required: false
        default: false
        type: boolean
      release-tag:
        description: "Release tag to upload to (required if upload-to-release is true)"
        required: false
        type: string

jobs:
  prepare:
    name: Prepare build args
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    outputs:
      release_version: ${{ steps.set.outputs.release_version }}
    steps:
      - name: Set ref and release version
        id: set
        run: |
          if [[ "${{ inputs.upload-to-release }}" == "true" && -z "${{ inputs.release-tag }}" ]]; then
            echo "::error::release-tag is required when upload-to-release is true"
            exit 1
          fi
          # Use workflow ref (from "Use workflow from" dropdown) for checkout, or release-tag when uploading
          if [[ "${{ inputs.upload-to-release }}" == "true" ]]; then
            echo "release_version=${{ inputs.release-tag }}" >> $GITHUB_OUTPUT
          else
            echo "release_version=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi

  build-wheel:
    name: Build wheel (manual)
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/_build.yml
    with:
      docker-image: ${{ inputs.docker-image }}
      python-version: ${{ inputs.python-version }}
      cuda-version: ${{ inputs.cuda-version }}
      torch-version: ${{ inputs.torch-version }}
      cxx11_abi: ${{ inputs.cxx11_abi }}
      runner-labels-json: ${{ inputs.runner-labels-json }}
      run-wheel-tests: ${{ inputs.run-wheel-tests }}
      wheel-test-target: ${{ inputs.wheel-test-target }}
      build-max-jobs: ${{ inputs.build-max-jobs }}
      nvcc-threads: ${{ inputs.nvcc-threads }}
      nvcc-lineinfo: ${{ inputs.nvcc-lineinfo }}
      nvcc-resource-usage: ${{ inputs.nvcc-resource-usage }}
      nvcc-split-compile: ${{ inputs.nvcc-split-compile }}
      skip-nvcc-gen-dependencies: ${{ inputs.skip-nvcc-gen-dependencies }}
      enable-ccache: ${{ inputs.enable-ccache }}
      ccache-namespace: ${{ inputs.ccache-namespace }}
      import-ccache-artifact: ${{ inputs.import-ccache-artifact }}
      import-ccache-bundle-path: ${{ inputs.import-ccache-bundle-path }}
      release-version: ${{ needs.prepare.outputs.release_version }}
      upload-to-release: ${{ inputs.upload-to-release }}
