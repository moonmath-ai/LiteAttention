name: Run Pytest Tests

on:
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  test:
    name: Test (Py ${{ matrix.python-version }}, CUDA ${{ matrix.cuda-version }}, Torch ${{ matrix.torch-version }})
    runs-on: [self-hosted, Linux]
    container:
      image: nvidia/cuda:${{ matrix.cuda-version }}-devel-ubuntu22.04
      options: --gpus all --pid=host --ipc=host
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        cuda-version: ["12.9.1"]
        torch-version: ["2.10.0"]
        exclude:
          # torch 2.7.1 does not support Python 3.13
          - python-version: "3.13"
            torch-version: "2.7.1"

    steps:
      - name: Set up environment
        run: |
          apt-get update && apt-get install -y \
            git \
            python3-pip

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set CUDA and PyTorch versions
        run: |
          echo "MATRIX_CUDA_VERSION=$(echo ${{ matrix.cuda-version }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV
          echo "MATRIX_TORCH_VERSION=$(echo ${{ matrix.torch-version }} | awk -F \. {'print $1 "." $2'})" >> $GITHUB_ENV
          echo "MATRIX_PYTHON_VERSION=$(echo ${{ matrix.python-version }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV

      - name: Install PyTorch ${{ matrix.torch-version }}+cu${{ matrix.cuda-version }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install typing-extensions==4.12.2
          export TORCH_CUDA_VERSION=$MATRIX_CUDA_VERSION
          # detect if we're on ARM
          if [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
              PLAT=linux_aarch64
          else
              PLAT=manylinux_2_27_x86_64.manylinux_2_28_x86_64
          fi
          echo "PLAT=$PLAT" >> $GITHUB_ENV
          if [[ ${{ matrix.torch-version }} == *"dev"* ]]; then
            python3 -m pip install jinja2
            TRITON_URL=https://download.pytorch.org/whl/nightly/pytorch_triton-3.4.0%2Bgitf7888497-cp${MATRIX_PYTHON_VERSION}-cp${MATRIX_PYTHON_VERSION}-${PLAT}.whl
            TORCH_URL=https://download.pytorch.org/whl/nightly/cu${TORCH_CUDA_VERSION}/torch-${{ matrix.torch-version }}%2Bcu${TORCH_CUDA_VERSION}-cp${MATRIX_PYTHON_VERSION}-cp${MATRIX_PYTHON_VERSION}-manylinux_2_28_$(uname -m).whl
            python3 -m pip install --no-cache-dir --pre "${TRITON_URL}"
            python3 -m pip install --no-cache-dir --pre "${TORCH_URL}"
          else
            python3 -m pip install --no-cache-dir torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cu${TORCH_CUDA_VERSION}
          fi
          nvcc --version
          python3 --version
          python3 -c "import torch; print('PyTorch:', torch.__version__)"
          python3 -c "import torch; print('CUDA:', torch.version.cuda)"
          python3 -c "from torch.utils import cpp_extension; print (cpp_extension.CUDA_HOME)"

      - name: Install dependencies and build project
        run: |
          python3 -m pip install setuptools==75.8.0
          python3 -m pip install ninja packaging wheel pytest
          export PATH=/usr/local/nvidia/bin:/usr/local/nvidia/lib64:$PATH
          export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/cuda/lib64:$LD_LIBRARY_PATH
          # Match PyTorch C++ ABI to avoid undefined symbol (c10::* or ListType::get)
          CXX11_ABI=$(python3 -c "import torch; print('TRUE' if torch._C._GLIBCXX_USE_CXX11_ABI else 'FALSE')")
          echo "Building with LITE_ATTENTION_FORCE_CXX11_ABI=$CXX11_ABI"
          export LITE_ATTENTION_FORCE_BUILD="TRUE"
          export LITE_ATTENTION_FORCE_CXX11_ABI=$CXX11_ABI
          export MAX_JOBS=$(nproc)
          export NVCC_THREADS=4
          python3 -m pip install --no-build-isolation .[dev]

      - name: Run pytest tests
        run: |
          pytest hopper/tests -v --tb=short
