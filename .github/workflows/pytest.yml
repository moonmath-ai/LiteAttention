name: Run Pytest Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run LiteAttention Tests
    runs-on: [self-hosted, gpu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: liteattention-test:latest

      - name: Run pytest tests
        run: |
          docker run --rm \
            --gpus=all \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/hopper \
            liteattention-test:latest \
            pytest tests
