name: Run Pytest Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run LiteAttention Tests
    runs-on: [self-hosted, gpu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Detect CUDA version for PyTorch index
        run: |
          ./.venv/bin/python - <<'PY'
          import os
          import re
          import subprocess

          cuda_version = None
          try:
              output = subprocess.check_output(["nvidia-smi"], text=True)
              match = re.search(r"CUDA Version:\s*([0-9.]+)", output)
              if match:
                  cuda_version = match.group(1)
          except Exception as exc:  # noqa: BLE001
              print(f"Could not detect CUDA version: {exc}")

          torch_label = None
          if cuda_version:
              match = re.match(r"(\d+)\.(\d+)", cuda_version)
              if match:
                  major, minor = match.groups()
                  torch_label = f"cu{int(major):d}{int(minor):02d}"

          index_url = f"https://download.pytorch.org/whl/{torch_label}" if torch_label else "https://download.pytorch.org/whl/cpu"

          print(f"Detected CUDA version: {cuda_version}, using index: {index_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"TORCH_INDEX_URL={index_url}\n")
          PY

      - name: Install PyTorch
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install packaging wheel
          python -m pip install --extra-index-url "${TORCH_INDEX_URL}" torch

      - name: Install project with dev extras
        working-directory: hopper
        run: |
          source ../.venv/bin/activate
          FLASH_ATTENTION_FORCE_CXX11_ABI=FALSE python -m pip install .[dev] --no-build-isolation

      - name: Run pytest tests
        working-directory: hopper
        run: |
          source ../.venv/bin/activate
          pytest tests
