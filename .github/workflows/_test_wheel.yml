name: ~Test wheel template

on:
  workflow_call:
    inputs:
      docker-image:
        description: "The Docker image to use for testing"
        required: true
        type: string
      python-version:
        description: "The Python version to use for testing"
        required: true
        type: string
      cuda-version:
        description: "The CUDA version to use for testing"
        required: true
        type: string
      torch-version:
        description: "The PyTorch version to use for testing"
        required: true
        type: string
      cxx11_abi:
        description: "The C++11 ABI expected by the wheel"
        required: true
        type: string
      runner-labels-json:
        description: "JSON array of runner labels (e.g. [\"self-hosted\",\"Linux\"])"
        required: false
        type: string
        default: "[\"self-hosted\",\"Linux\"]"
      wheel-test-target:
        description: "Pytest target to run against installed wheel"
        required: false
        type: string
        default: "hopper/tests/test_lite_attention.py"
      wheel-artifact-name:
        description: "Optional explicit wheel artifact name to download (overrides derived per-python name)"
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  test-wheel:
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    container:
      image: ${{ inputs.docker-image }}
      options: --gpus all
    name: Test wheel (py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}-cxx11abi${{ inputs.cxx11_abi }})
    steps:
      - name: Set up environment
        run: |
          apt-get update && apt-get install -y \
            git \
            python3-pip

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set CUDA and PyTorch versions
        run: |
          echo "MATRIX_CUDA_VERSION=$(echo ${{ inputs.cuda-version }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV
          echo "MATRIX_TORCH_VERSION=$(echo ${{ inputs.torch-version }} | awk -F \. {'print $1 "." $2'})" >> $GITHUB_ENV
          echo "MATRIX_PYTHON_VERSION=$(echo ${{ inputs.python-version }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV
          if [[ -n "${{ inputs.wheel-artifact-name }}" ]]; then
            echo "WHEEL_ARTIFACT=${{ inputs.wheel-artifact-name }}" >> $GITHUB_ENV
          else
            echo "WHEEL_ARTIFACT=wheel-py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}-cxx11abi${{ inputs.cxx11_abi }}" >> $GITHUB_ENV
          fi

      - name: Check project Python minimum
        id: py_compat
        run: |
          python3 - <<'PY'
          import os

          py = os.environ["PYTHON_VERSION"]
          major, minor = (int(x) for x in py.split(".")[:2])
          if (major, minor) < (3, 9):
              print(f"Python {py} is below project minimum 3.9")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("skip_tests=true\n")
          PY
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}

      - name: Install PyTorch ${{ inputs.torch-version }}+cu${{ inputs.cuda-version }}
        id: torch_install
        if: steps.py_compat.outputs.skip_tests != 'true'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install typing-extensions==4.12.2
          export TORCH_CUDA_VERSION=$MATRIX_CUDA_VERSION
          # detect if we're on ARM
          if [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
              PLAT=linux_aarch64
          else
              PLAT=manylinux_2_27_x86_64.manylinux_2_28_x86_64
          fi
          echo "PLAT=$PLAT" >> $GITHUB_ENV
          if [[ ${{ inputs.torch-version }} == *"dev"* ]]; then
            python3 -m pip install jinja2
            TRITON_URL=https://download.pytorch.org/whl/nightly/pytorch_triton-3.4.0%2Bgitf7888497-cp${MATRIX_PYTHON_VERSION}-cp${MATRIX_PYTHON_VERSION}-${PLAT}.whl
            TORCH_URL=https://download.pytorch.org/whl/nightly/cu${TORCH_CUDA_VERSION}/torch-${{ inputs.torch-version }}%2Bcu${TORCH_CUDA_VERSION}-cp${MATRIX_PYTHON_VERSION}-cp${MATRIX_PYTHON_VERSION}-manylinux_2_28_$(uname -m).whl
            python3 -m pip install --no-cache-dir --pre "${TRITON_URL}"
            python3 -m pip install --no-cache-dir --pre "${TORCH_URL}"
          else
            set +e
            python3 -m pip install --no-cache-dir torch==${{ inputs.torch-version }} --index-url https://download.pytorch.org/whl/cu${TORCH_CUDA_VERSION} 2>&1 | tee /tmp/torch_install.log
            status=${PIPESTATUS[0]}
            set -e
            if [ $status -ne 0 ]; then
              if grep -E "No matching distribution found|Could not find a version that satisfies the requirement" /tmp/torch_install.log >/dev/null; then
                echo "Skipping tests: torch wheel not available for this Python/CUDA combo."
                echo "skip_tests=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              exit $status
            fi
          fi
          nvcc --version
          python3 --version
          python3 -c "import torch; print('PyTorch:', torch.__version__)"
          python3 -c "import torch; print('CUDA:', torch.version.cuda)"

      - name: Check ABI compatibility
        id: abi
        if: steps.py_compat.outputs.skip_tests != 'true' && steps.torch_install.outputs.skip_tests != 'true'
        run: |
          python3 - <<'PY'
          import os
          import torch

          want = os.environ["WANT_CXX11_ABI"]
          have = "TRUE" if torch._C._GLIBCXX_USE_CXX11_ABI else "FALSE"
          print(f"torch ABI: {have}, wheel ABI: {want}")
          if have != want:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("skip_tests=true\n")
          PY
        env:
          WANT_CXX11_ABI: ${{ inputs.cxx11_abi }}

      - name: Download wheel artifact
        if: steps.py_compat.outputs.skip_tests != 'true' && steps.torch_install.outputs.skip_tests != 'true' && steps.abi.outputs.skip_tests != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.WHEEL_ARTIFACT }}
          path: wheel-dist

      - name: Install wheel and test deps
        if: steps.py_compat.outputs.skip_tests != 'true' && steps.torch_install.outputs.skip_tests != 'true' && steps.abi.outputs.skip_tests != 'true'
        run: |
          python3 -m pip install pytest numpy
          python3 -m pip install wheel-dist/*.whl

      - name: Run pytest tests
        if: steps.py_compat.outputs.skip_tests != 'true' && steps.torch_install.outputs.skip_tests != 'true' && steps.abi.outputs.skip_tests != 'true'
        run: |
          pytest ${{ inputs.wheel-test-target }}

      - name: Skip note (ABI mismatch)
        if: steps.py_compat.outputs.skip_tests != 'true' && steps.torch_install.outputs.skip_tests != 'true' && steps.abi.outputs.skip_tests == 'true'
        run: |
          echo "Skipping wheel tests because torch ABI does not match wheel ABI."

      - name: Skip note (incompatible combo)
        if: steps.py_compat.outputs.skip_tests == 'true' || steps.torch_install.outputs.skip_tests == 'true'
        run: |
          echo "Skipping wheel tests because Python/CUDA/PyTorch combination is incompatible."
