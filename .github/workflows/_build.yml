name: ~Build wheel template

on:
  workflow_call:
    inputs:
      docker-image:
        description: "The Docker image to use for the build"
        required: true
        type: string
      python-version:
        description: "The Python version to use for the build"
        required: true
        type: string
      cuda-version:
        description: "The CUDA version to use for the build"
        required: true
        type: string
      torch-version:
        description: "The PyTorch version to use for the build"
        required: true
        type: string
      cxx11_abi:
        description: "The C++11 ABI to use for the build"
        required: true
        type: string
      cxx11_abi_list_json:
        description: "Optional JSON array of C++11 ABI values to build sequentially in one job"
        required: false
        type: string
        default: ""
      runner-labels-json:
        description: "JSON array of runner labels (e.g. [\"self-hosted\",\"Linux\"])"
        required: false
        type: string
        default: "[\"self-hosted\",\"Linux\"]"
      enable-ccache:
        description: "Enable ccache restore/save and artifact bundling"
        required: false
        type: boolean
        default: true
      ccache-namespace:
        description: "Namespace segment for ccache keying"
        required: false
        type: string
        default: "default"
      ccache-bundle-artifact-name:
        description: "Optional explicit artifact name for uploaded ccache bundle"
        required: false
        type: string
        default: ""
      ccache-restore-mode:
        description: "Restore strictness for ccache keys: compatible (cross-python), python, exact"
        required: false
        type: string
        default: "compatible"
      import-ccache-artifact:
        description: "Optional artifact name containing ccache-bundle.tar.zst to import before build"
        required: false
        type: string
        default: ""
      import-ccache-bundle-path:
        description: "Optional direct path to a ccache-bundle.tar.zst file (useful for act/local testing)"
        required: false
        type: string
        default: ""
      run-wheel-tests:
        description: "Install built wheel and run lite_attention tests"
        required: false
        type: boolean
        default: true
      wheel-test-target:
        description: "Pytest target to run against installed wheel"
        required: false
        type: string
        default: "hopper/tests/test_lite_attention.py"
      build-max-jobs:
        description: "Optional override for MAX_JOBS in the wheel build"
        required: false
        type: string
        default: ""
      nvcc-threads:
        description: "Optional override for NVCC_THREADS in the wheel build"
        required: false
        type: string
        default: ""
      nvcc-lineinfo:
        description: "Optional override for LITE_ATTENTION_NVCC_LINEINFO"
        required: false
        type: string
        default: ""
      nvcc-resource-usage:
        description: "Optional override for LITE_ATTENTION_NVCC_RESOURCE_USAGE"
        required: false
        type: string
        default: ""
      nvcc-split-compile:
        description: "Optional override for LITE_ATTENTION_NVCC_SPLIT_COMPILE"
        required: false
        type: string
        default: ""
      skip-nvcc-gen-dependencies:
        description: "Optional override for LITE_ATTENTION_SKIP_NVCC_GEN_DEPENDENCIES"
        required: false
        type: string
        default: ""
      build-profile:
        description: "Enable detailed NVCC/Ninja profiling artifacts and summary"
        required: false
        type: boolean
        default: false
      upload-to-release:
        description: "Upload wheel to this release"
        required: false
        type: boolean
        default: false
      release-version:
        description: "Upload wheel to this release"
        required: false
        type: string

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  build-wheel:
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    # GitHub-hosted jobs top out at 6h. Batched ABI jobs need an explicit cap
    # below that so teardown/upload steps still have room to run.
    timeout-minutes: ${{ contains(inputs.cxx11_abi, '_') && 355 || 360 }}
    container:
      image: ${{ inputs.docker-image }}
      # Build-only jobs do not need host GPU access, and avoiding --gpus all
      # keeps CUDA 13 containers from depending on the runner's driver version.
      options: ${{ inputs.run-wheel-tests && '--gpus all' || '' }}
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
      BUILD_WHEEL_DIR: build-wheel-py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}-abi${{ inputs.cxx11_abi }}
      CCACHE_DIR: /tmp/liteattention-ccache
      CCACHE_BASEDIR: /__w
      CCACHE_MAXSIZE: 8G
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_STATSLOG: /tmp/ccache-stats-py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}-abi${{ inputs.cxx11_abi }}.log
      PIP_CACHE_DIR: /root/.cache/pip
      PIP_CACHE_OPT: --no-cache-dir
    name: Build wheel (${{ inputs.release-version }}-${{ inputs.python-version }}-${{ inputs.cuda-version }}-${{ inputs.torch-version }}-${{ inputs.cxx11_abi }})
    steps:
      - name: Configure shared caches for act
        if: ${{ env.ACT }}
        run: |
          ACT_CACHE_ROOT="${GITHUB_WORKSPACE}/.act-cache"
          mkdir -p \
            "${ACT_CACHE_ROOT}/pip" \
            "${ACT_CACHE_ROOT}/ccache"

          echo "PIP_CACHE_DIR=${ACT_CACHE_ROOT}/pip" >> "$GITHUB_ENV"
          echo "PIP_CACHE_OPT=" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${ACT_CACHE_ROOT}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Set up environment
        run: |
          ln -snf "/usr/share/zoneinfo/${TZ}" /etc/localtime
          echo "${TZ}" > /etc/timezone
          apt-get update && apt-get install -y \
            git \
            python3-pip \
            rsync \
            ccache \
            time \
            zstd

      - name: Install GitHub CLI (release upload only)
        if: ${{ !env.ACT && inputs.upload-to-release }}
        run: |
          apt-get update
          apt-get install -y wget
          mkdir -p -m 755 /etc/apt/keyrings
          out=$(mktemp)
          wget -nv -O"$out" https://cli.github.com/packages/githubcli-archive-keyring.gpg
          cat "$out" | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          mkdir -p -m 755 /etc/apt/sources.list.d
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update
          apt-get install -y gh
      - name: Checkout (GitHub)
        if: ${{ !env.ACT }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.release-version }}
          submodules: recursive
          path: ${{ env.BUILD_WHEEL_DIR }}

      - name: Checkout (act)
        if: ${{ env.ACT }}
        run: |
          git config --global --add safe.directory '*' || true
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true
          if git rev-parse --show-toplevel >/dev/null 2>&1; then
            git submodule sync --recursive
            git submodule update --init --recursive
          else
            echo "::warning::ACT workspace is not a git checkout; skipping submodule sync/update and copying the mounted workspace as-is."
          fi
          mkdir -p "${BUILD_WHEEL_DIR}"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.act-cache' \
            --exclude '.tmp' \
            --exclude '.artifacts' \
            --exclude 'wheels' \
            --exclude 'build-wheel*' \
            ./ "${BUILD_WHEEL_DIR}/"

      - name: Set up Python ${{ inputs.python-version }} (GitHub)
        if: ${{ !env.ACT }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set up Python ${{ inputs.python-version }} (act)
        if: ${{ env.ACT }}
        run: |
          py_ver="${{ inputs.python-version }}"
          if [[ "$py_ver" == "3.10" ]]; then
            python3 --version
            exit 0
          fi
          apt-get update
          apt-get install -y software-properties-common
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update
          apt-get install -y "python${py_ver}" "python${py_ver}-dev" "python${py_ver}-venv"
          update-alternatives --install /usr/bin/python3 python3 "/usr/bin/python${py_ver}" 2
          python3 -m ensurepip --upgrade || true
          python3 --version

      - name: Set CUDA and PyTorch versions
        run: |
          echo "MATRIX_CUDA_VERSION=$(echo ${{ inputs.cuda-version }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV
          echo "MATRIX_TORCH_VERSION=$(echo ${{ inputs.torch-version }} | awk -F \. {'print $1 "." $2'})" >> $GITHUB_ENV
          echo "WHEEL_CUDA_VERSION=$(echo ${{ inputs.cuda-version }} | awk -F \. {'print $1 "." $2'})" >> $GITHUB_ENV
          echo "MATRIX_PYTHON_VERSION=$(echo ${{ inputs.python-version }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV

      - name: Resolve ABI batch
        id: abi_batch
        run: |
          ABI_LIST_JSON='${{ inputs.cxx11_abi_list_json }}'
          if [[ -z "$ABI_LIST_JSON" ]]; then
            ABI_LIST_JSON="$(DEFAULT_ABI="${DEFAULT_ABI}" python3 -c 'import json, os; print(json.dumps([os.environ["DEFAULT_ABI"]], separators=(",", ":")))' )"
          fi

          ABI_LIST_JSON="$ABI_LIST_JSON" python3 -c 'import json, os; abis = json.loads(os.environ["ABI_LIST_JSON"]); assert isinstance(abis, list) and abis, "cxx11_abi_list_json must decode to a non-empty JSON array"; seen = []; [seen.append(abi) for abi in map(str, abis) if abi not in seen]; payload = json.dumps(seen, separators=(",", ":")); artifact_label = f"cxx11abi{seen[0]}" if len(seen) == 1 else "cxx11abis" + "_".join(seen); open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write(f"list_json={payload}\ncount={len(seen)}\nartifact_label={artifact_label}\n")'
        env:
          DEFAULT_ABI: ${{ inputs.cxx11_abi }}

      - name: Compute ccache key
        id: ccache_key
        if: ${{ inputs.enable-ccache }}
        run: |
          image_id=$(echo "${{ inputs.docker-image }}" | tr '/:.' '-' | tr -cd 'A-Za-z0-9_-')
          base_prefix="ccache-${{ inputs.ccache-namespace }}-${{ runner.os }}-${{ runner.arch }}-${image_id}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}-abi${{ inputs.cxx11_abi }}"
          prefix="${base_prefix}-py${{ inputs.python-version }}"
          echo "prefix=${prefix}-" >> "$GITHUB_OUTPUT"
          echo "cross_py_prefix=${base_prefix}-" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Configure pip cache for GitHub
        if: ${{ !env.ACT }}
        run: |
          mkdir -p "${PIP_CACHE_DIR}"
          echo "PIP_CACHE_OPT=" >> "$GITHUB_ENV"

      - name: Restore pip download cache
        if: ${{ !env.ACT }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-
            pip-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-

      - name: Resolve ccache restore mode
        id: ccache_restore_mode
        if: ${{ !env.ACT && inputs.enable-ccache && inputs.import-ccache-artifact == '' && inputs.import-ccache-bundle-path == '' }}
        run: |
          mode_raw='${{ inputs.ccache-restore-mode }}'
          mode="$(echo "${mode_raw}" | tr '[:upper:]' '[:lower:]')"
          case "${mode}" in
            compatible)
              restore_keys="${{ steps.ccache_key.outputs.prefix }}"$'\n'"${{ steps.ccache_key.outputs.cross_py_prefix }}"
              ;;
            python)
              restore_keys="${{ steps.ccache_key.outputs.prefix }}"
              ;;
            exact)
              restore_keys=""
              ;;
            *)
              echo "::error::Invalid ccache-restore-mode='${mode_raw}'. Expected one of: compatible, python, exact."
              exit 1
              ;;
          esac
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          {
            echo "restore_keys<<EOF"
            printf "%s\n" "${restore_keys}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore compatible ccache
        id: restore_ccache
        if: ${{ !env.ACT && inputs.enable-ccache && inputs.import-ccache-artifact == '' && inputs.import-ccache-bundle-path == '' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache_key.outputs.key }}
          restore-keys: ${{ steps.ccache_restore_mode.outputs.restore_keys }}

      - name: Initialize ccache
        if: ${{ inputs.enable-ccache }}
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache -o max_size="${CCACHE_MAXSIZE}"
          ccache -o compression=true
          ccache -o compression_level=5
          ccache -o base_dir="${CCACHE_BASEDIR}"
          ccache -o compiler_check="${CCACHE_COMPILERCHECK}"
          ccache -o stats_log="${CCACHE_STATSLOG}"
          if [[ -n "${CCACHE_LOGFILE:-}" ]]; then
            mkdir -p "$(dirname "${CCACHE_LOGFILE}")"
            : > "${CCACHE_LOGFILE}"
            ccache -o log_file="${CCACHE_LOGFILE}"
          fi
          if [[ -n "${CCACHE_DEBUGDIR:-}" ]]; then
            mkdir -p "${CCACHE_DEBUGDIR}"
          fi
          : > "${CCACHE_STATSLOG}"
          ccache -s || true
          ccache -z || true

      - name: Download imported ccache bundle artifact
        if: ${{ !env.ACT && inputs.enable-ccache && inputs.import-ccache-artifact != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.import-ccache-artifact }}
          path: /tmp/imported-ccache

      - name: Import ccache bundle
        if: ${{ inputs.enable-ccache && (inputs.import-ccache-bundle-path != '' || inputs.import-ccache-artifact != '') }}
        run: |
          bundle_path="${{ inputs.import-ccache-bundle-path }}"
          if [[ -z "$bundle_path" ]]; then
            bundle_path="/tmp/imported-ccache/ccache-bundle.tar.zst"
          fi
          if [[ ! -f "$bundle_path" ]]; then
            echo "::error::Requested ccache bundle not found at '$bundle_path'"
            exit 1
          fi
          mkdir -p "${CCACHE_DIR}"
          tar --use-compress-program="zstd -d -T0" -xf "$bundle_path" -C "${CCACHE_DIR}"
          echo "Imported ccache bundle from $bundle_path"
          ccache -s || true

      - name: Check project Python minimum
        id: py_compat
        run: |
          python3 - <<'PY'
          import os

          py = os.environ["PYTHON_VERSION"]
          major, minor = (int(x) for x in py.split(".")[:2])
          if (major, minor) < (3, 9):
              print(f"Python {py} is below project minimum 3.9")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("skip_build=true\n")
          PY
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}

      - name: Install PyTorch ${{ inputs.torch-version }}+cu${{ inputs.cuda-version }}
        id: torch_install
        if: steps.py_compat.outputs.skip_build != 'true'
        run: |
          python3 -m pip install --upgrade pip
          # Python 3.12+ removed stdlib distutils; pin setuptools early so
          # torch/cpp_extension imports use setuptools' vendored distutils.
          python3 -m pip install setuptools==75.8.0
          # With python 3.13 and torch 2.5.1, unless we update typing-extensions, we get error
          # AttributeError: attribute '__default__' of 'typing.ParamSpec' objects is not writable
          python3 -m pip install typing-extensions==4.12.2
          # Use the CUDA version that's already installed on the system
          # Download PyTorch wheel built for the same CUDA version
          export TORCH_CUDA_VERSION=$MATRIX_CUDA_VERSION
          # PyTorch CUDA 13 wheels are currently published as cu130; reuse them for newer 13.x containers.
          if [[ "${MATRIX_CUDA_VERSION}" == 13* && "${MATRIX_CUDA_VERSION}" != "130" ]]; then
            TORCH_CUDA_VERSION=130
          fi
          # detect if we're on ARM
          if [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ]; then
              PLAT=linux_aarch64
          else
              PLAT=manylinux_2_27_x86_64.manylinux_2_28_x86_64
          fi
          echo "PLAT=$PLAT" >> $GITHUB_ENV
          if [[ ${{ inputs.torch-version }} == *"dev"* ]]; then
            # pip install --no-cache-dir --pre torch==${{ inputs.torch-version }} --index-url https://download.pytorch.org/whl/nightly/cu${TORCH_CUDA_VERSION}
            # Can't use --no-deps because we need cudnn etc.
            # Hard-coding this version of pytorch-triton for torch 2.9.0.dev20250904
            python3 -m pip install jinja2
            TRITON_URL=https://download.pytorch.org/whl/nightly/pytorch_triton-3.4.0%2Bgitf7888497-cp${MATRIX_PYTHON_VERSION}-cp${MATRIX_PYTHON_VERSION}-${PLAT}.whl
            TORCH_URL=https://download.pytorch.org/whl/nightly/cu${TORCH_CUDA_VERSION}/torch-${{ inputs.torch-version }}%2Bcu${TORCH_CUDA_VERSION}-cp${MATRIX_PYTHON_VERSION}-cp${MATRIX_PYTHON_VERSION}-manylinux_2_28_$(uname -m).whl
            python3 -m pip install ${PIP_CACHE_OPT} --pre "${TRITON_URL}"
            python3 -m pip install ${PIP_CACHE_OPT} --pre "${TORCH_URL}"
          else
            set +e
            python3 -m pip install ${PIP_CACHE_OPT} torch==${{ inputs.torch-version }} --index-url https://download.pytorch.org/whl/cu${TORCH_CUDA_VERSION} 2>&1 | tee /tmp/torch_install.log
            status=${PIPESTATUS[0]}
            set -e
            if [ $status -ne 0 ]; then
              if grep -E "No matching distribution found|Could not find a version that satisfies the requirement" /tmp/torch_install.log >/dev/null; then
                echo "Skipping build: torch wheel not available for this Python/CUDA combo."
                echo "skip_build=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              exit $status
            fi
          fi
          nvcc --version
          python3 --version
          python3 -c "import torch; print('PyTorch:', torch.__version__)"
          python3 -c "import torch; print('CUDA:', torch.version.cuda)"
          python3 -c "from torch.utils import cpp_extension; print (cpp_extension.CUDA_HOME)"

      - name: Build wheel
        id: build_wheel
        continue-on-error: true
        if: steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true'
        working-directory: ${{ env.BUILD_WHEEL_DIR }}
        env:
          ABI_LIST_JSON: ${{ steps.abi_batch.outputs.list_json }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true
          git config --global --add safe.directory "$(pwd)" || true

          python3 -m pip install ninja packaging wheel
          export PATH=/usr/local/nvidia/bin:/usr/local/nvidia/lib64:$PATH
          export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/cuda/lib64:$LD_LIBRARY_PATH

          USE_CCACHE_WRAPPERS="${{ inputs.enable-ccache }}"
          if [[ "${{ inputs.build-profile }}" == "true" ]]; then
            # Keep profiling runs on the direct nvcc path so timing/trace output
            # is not distorted by the ccache wrapper layer and nvcc can resolve
            # its helper binaries relative to the real compiler.
            USE_CCACHE_WRAPPERS="false"
          fi

          if [[ "${USE_CCACHE_WRAPPERS}" == "true" ]]; then
            REAL_NVCC=$(command -v nvcc)
            # Keep wrapper path stable across workspace locations to improve
            # ccache command identity and cross-host reuse quality.
            WRAPPER_DIR="/tmp/liteattention-ccache-wrappers"
            WRAPPER_NVCC="${WRAPPER_DIR}/nvcc"
            mkdir -p "${WRAPPER_DIR}"
            printf '%s\n' '#!/usr/bin/env bash' "exec ccache \"${REAL_NVCC}\" \"\$@\"" > "${WRAPPER_NVCC}"
            chmod +x "${WRAPPER_NVCC}"
            export PATH="/usr/lib/ccache:${WRAPPER_DIR}:$PATH"
            export CUDA_NVCC_EXECUTABLE="${WRAPPER_NVCC}"
            export PYTORCH_NVCC="${WRAPPER_NVCC}"
            # Let PATH-resolved ccache compiler shims handle gcc/g++ instead of passing
            # a space-containing command through CC/CXX, which breaks Ninja invocation.
            export CC=gcc
            export CXX=g++
            # Keep CUDA_HOME stable so setup.py does not infer it from the ccache wrapper path.
            export CUDA_HOME=/usr/local/cuda
          elif [[ "${{ inputs.enable-ccache }}" == "true" ]]; then
            echo "Profiling run: bypassing ccache wrappers for direct nvcc execution."
          fi
          export USE_CCACHE_WRAPPERS
          if [[ -n "${{ inputs.build-max-jobs }}" ]]; then
            export LITE_ATTENTION_BUILD_MAX_JOBS="${{ inputs.build-max-jobs }}"
          fi
          if [[ -n "${{ inputs.nvcc-threads }}" ]]; then
            export LITE_ATTENTION_BUILD_NVCC_THREADS="${{ inputs.nvcc-threads }}"
          fi
          if [[ -n "${{ inputs.nvcc-lineinfo }}" ]]; then
            export LITE_ATTENTION_NVCC_LINEINFO="${{ inputs.nvcc-lineinfo }}"
          fi
          if [[ -n "${{ inputs.nvcc-resource-usage }}" ]]; then
            export LITE_ATTENTION_NVCC_RESOURCE_USAGE="${{ inputs.nvcc-resource-usage }}"
          fi
          if [[ -n "${{ inputs.nvcc-split-compile }}" ]]; then
            export LITE_ATTENTION_NVCC_SPLIT_COMPILE="${{ inputs.nvcc-split-compile }}"
          fi
          if [[ -n "${{ inputs.skip-nvcc-gen-dependencies }}" ]]; then
            export LITE_ATTENTION_SKIP_NVCC_GEN_DEPENDENCIES="${{ inputs.skip-nvcc-gen-dependencies }}"
          elif [[ "${{ inputs.enable-ccache }}" == "true" && "${{ inputs.build-profile }}" != "true" ]]; then
            # CI jobs wipe build/ per ABI, so depfiles mainly add overhead and can
            # reduce cacheability for nvcc-heavy translation units.
            export LITE_ATTENTION_SKIP_NVCC_GEN_DEPENDENCIES=TRUE
          fi
          if [[ "${{ inputs.build-profile }}" == "true" ]]; then
            export LITE_ATTENTION_NVCC_TIME=TRUE
            # CUDA 12.8 profiling in CI has been reliable with phase CSV plus
            # per-TU walltime, but fdevice trace has repeatedly failed in the
            # act/container path even on direct nvcc. Keep it opt-in via the
            # setup.py env flag instead of enabling it by default here.
            export LITE_ATTENTION_NVCC_PER_TU_TIME=TRUE
            export NINJA_STATUS="[%f/%t %r active | %e sec]"
            mkdir -p build-profile
            TIME_BIN=""
            TIME_BIN_KIND="missing"
            if [[ -x /usr/bin/time ]]; then
              TIME_BIN="/usr/bin/time"
              TIME_BIN_KIND="usr-bin"
            elif command -v time >/dev/null 2>&1; then
              TIME_BIN="$(command -v time)"
              TIME_BIN_KIND="path"
            fi
          fi
          # Allow benchmark runs to override compile scheduling without changing
          # which kernels are built. Fall back to the existing safe defaults.
          default_max_jobs=$([ "$MATRIX_CUDA_VERSION" == "129" ] && echo 1 || echo 2)
          export MAX_JOBS="${LITE_ATTENTION_BUILD_MAX_JOBS:-${MAX_JOBS:-$default_max_jobs}}"
          export NVCC_THREADS="${LITE_ATTENTION_BUILD_NVCC_THREADS:-${NVCC_THREADS:-2}}"
          echo "Compile settings: MAX_JOBS=${MAX_JOBS} NVCC_THREADS=${NVCC_THREADS}"
          if [[ "${{ inputs.enable-ccache }}" == "true" ]]; then
            echo "::group::ccache runtime"
            python3 - <<'PY'
            import json
            import os
            import shutil
            import subprocess

            keys = [
                "USE_CCACHE_WRAPPERS",
                "CCACHE_DIR",
                "CCACHE_BASEDIR",
                "CCACHE_MAXSIZE",
                "CCACHE_COMPILERCHECK",
                "CCACHE_NOHASHDIR",
                "CCACHE_STATSLOG",
                "CCACHE_LOGFILE",
                "CCACHE_DEBUG",
                "CCACHE_DEBUGLEVEL",
                "CCACHE_DEBUGDIR",
                "CUDA_NVCC_EXECUTABLE",
                "PYTORCH_NVCC",
                "CUDA_HOME",
                "CC",
                "CXX",
                "MAX_JOBS",
                "NVCC_THREADS",
                "LITE_ATTENTION_SKIP_NVCC_GEN_DEPENDENCIES",
                "LITE_ATTENTION_NVCC_RESOURCE_USAGE",
                "LITE_ATTENTION_NVCC_LINEINFO",
                "LITE_ATTENTION_NVCC_SPLIT_COMPILE",
            ]
            info = {key: os.environ.get(key, "") for key in keys}
            info["which"] = {tool: shutil.which(tool) or "" for tool in ("ccache", "nvcc", "gcc", "g++")}
            if info["which"]["ccache"]:
                try:
                    version_lines = subprocess.check_output(["ccache", "--version"], text=True).splitlines()
                    info["ccache_version"] = version_lines[0] if version_lines else ""
                except Exception as exc:
                    info["ccache_version_error"] = str(exc)
            print(json.dumps(info, indent=2, sort_keys=True))
            PY
            ccache -p | sed -n 's/^\(base_dir\|cache_dir\|compiler_check\|debug\|debug_dir\|hash_dir\|log_file\|namespace\|sloppiness\|stats_log\|temporary_dir\) = /\1=/p' || true
            echo "::endgroup::"
          fi
          export LITE_ATTENTION_FORCE_BUILD="TRUE"
          if [[ "${{ inputs.build-profile }}" == "true" ]]; then
            USE_CCACHE_WRAPPERS="${USE_CCACHE_WRAPPERS}" TIME_BIN="${TIME_BIN:-}" TIME_BIN_KIND="${TIME_BIN_KIND:-missing}" python3 -c 'import json, os, shutil; runtime_info = {"use_ccache_wrappers": os.environ["USE_CCACHE_WRAPPERS"], "time_bin": os.environ.get("TIME_BIN", ""), "time_bin_kind": os.environ.get("TIME_BIN_KIND", "missing"), "nvcc_path": shutil.which("nvcc") or "", "cuda_nvcc_executable": os.environ.get("CUDA_NVCC_EXECUTABLE", ""), "pytorch_nvcc": os.environ.get("PYTORCH_NVCC", ""), "ccache_logfile": os.environ.get("CCACHE_LOGFILE", ""), "ccache_debugdir": os.environ.get("CCACHE_DEBUGDIR", ""), "max_jobs": os.environ.get("MAX_JOBS", ""), "nvcc_threads": os.environ.get("NVCC_THREADS", ""), "lite_attention_nvcc_time": os.environ.get("LITE_ATTENTION_NVCC_TIME", ""), "lite_attention_nvcc_per_tu_time": os.environ.get("LITE_ATTENTION_NVCC_PER_TU_TIME", ""), "lite_attention_nvcc_fdevice_time_trace": os.environ.get("LITE_ATTENTION_NVCC_FDEVICE_TIME_TRACE", "")}; open("build-profile/runtime_info.json", "w", encoding="utf-8").write(json.dumps(runtime_info, indent=2))'
          fi

          ABI_VALUES=()
          abi_values_file="$(mktemp)"
          ABI_LIST_JSON="$ABI_LIST_JSON" python3 -c 'import json, os; [print(str(abi)) for abi in json.loads(os.environ["ABI_LIST_JSON"])]' > "$abi_values_file"
          while IFS= read -r abi_value; do
            [[ -n "$abi_value" ]] || continue
            ABI_VALUES+=("$abi_value")
          done < "$abi_values_file"
          rm -f "$abi_values_file"

          ABI_COUNT=${#ABI_VALUES[@]}
          if (( ABI_COUNT > 1 )); then
            JOB_TIMEOUT_MIN=355
            BUILD_BUDGET_MIN=335
            # Leave headroom for setup, wheel post-processing, and artifact uploads.
            ABI_TIMEOUT_MIN=$(( BUILD_BUDGET_MIN / ABI_COUNT ))
          else
            JOB_TIMEOUT_MIN=360
            ABI_TIMEOUT_MIN=300
          fi
          echo "Batch timeout budget: job=${JOB_TIMEOUT_MIN}m abi_count=${ABI_COUNT} per_abi=${ABI_TIMEOUT_MIN}m"

          mkdir -p dist
          EXIT_CODE=0
          for ABI_VALUE in "${ABI_VALUES[@]}"; do
            echo "::group::Build wheel for ABI ${ABI_VALUE}"
            rm -rf build "dist-${ABI_VALUE}"
            mkdir -p "dist-${ABI_VALUE}"
            export LITE_ATTENTION_FORCE_CXX11_ABI="${ABI_VALUE}"

            ABI_EXIT_CODE=0
            if [[ "${{ inputs.build-profile }}" == "true" ]]; then
              if command -v /usr/bin/time >/dev/null 2>&1; then
                /usr/bin/time -f "wall_s=%e user_s=%U sys_s=%S maxrss_kb=%M exit=%x" -o "build-profile/setup_py_${ABI_VALUE}.walltime.txt" \
                  timeout "${ABI_TIMEOUT_MIN}m" python3 setup.py bdist_wheel --dist-dir="dist-${ABI_VALUE}" || ABI_EXIT_CODE=$?
              else
                echo "::warning::/usr/bin/time not found; setup.py walltime file will not be recorded."
                timeout "${ABI_TIMEOUT_MIN}m" python3 setup.py bdist_wheel --dist-dir="dist-${ABI_VALUE}" || ABI_EXIT_CODE=$?
              fi
            else
              timeout "${ABI_TIMEOUT_MIN}m" python3 setup.py bdist_wheel --dist-dir="dist-${ABI_VALUE}" || ABI_EXIT_CODE=$?
            fi

            if [ $ABI_EXIT_CODE -ne 0 ]; then
              EXIT_CODE=$ABI_EXIT_CODE
              echo "ABI ${ABI_VALUE} build failed with exit code ${ABI_EXIT_CODE}"
              echo "::endgroup::"
              continue
            fi

            built_wheel_count=0
            for built_wheel in "dist-${ABI_VALUE}"/*.whl; do
              if [[ ! -e "$built_wheel" ]]; then
                continue
              fi
              built_wheel_count=$(( built_wheel_count + 1 ))
              base_wheel_name="$(basename "$built_wheel")"
              tmpname="cu${WHEEL_CUDA_VERSION}torch${MATRIX_TORCH_VERSION}cxx11abi${ABI_VALUE}"
              wheel_name="$(echo "$base_wheel_name" | sed "s/-/+$tmpname-/2")"
              mv "$built_wheel" "dist/${wheel_name}"
            done

            if [ "$built_wheel_count" -eq 0 ]; then
              echo "::error::ABI ${ABI_VALUE} build completed without producing a wheel"
              EXIT_CODE=1
              echo "::endgroup::"
              continue
            fi

            if [[ "${{ inputs.build-profile }}" == "true" ]]; then
              abi_profile_dir="build-profile/abi-${ABI_VALUE}/raw"
              mkdir -p "${abi_profile_dir}"
              if [ -d build ]; then
                abi_profile_files="$(mktemp)"
                find build -type f \( -name '*.nvcc_time.csv' -o -name '*.json' -o -name '*.nvcc_walltime.txt' -o -name '.ninja_log' \) > "$abi_profile_files"
                while IFS= read -r f; do
                  [[ -n "$f" ]] || continue
                  cp --parents "$f" "${abi_profile_dir}/"
                done < "$abi_profile_files"
                rm -f "$abi_profile_files"
              fi
            fi
            echo "::endgroup::"
          done

          # Store exit code in GitHub env for later steps
          echo "build_exit_code=$EXIT_CODE" | tee -a "$GITHUB_OUTPUT"

          if [[ "${{ inputs.enable-ccache }}" == "true" ]]; then
            ccache -sv || true
            if [[ -f "${CCACHE_STATSLOG}" ]]; then
              echo "::group::ccache log stats"
              ccache --show-log-stats || true
              echo "::endgroup::"
            fi
            if [[ -n "${CCACHE_LOGFILE:-}" && -f "${CCACHE_LOGFILE}" ]]; then
              echo "::group::ccache logfile tail"
              tail -n 200 "${CCACHE_LOGFILE}" || true
              echo "::endgroup::"
            fi
          fi

          # Do not fail the job if timeout killed the build
          exit $EXIT_CODE

      - name: Collect build profile summary
        if: ${{ always() && inputs.build-profile && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' }}
        working-directory: ${{ env.BUILD_WHEEL_DIR }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import re
          from pathlib import Path

          out_dir = Path("build-profile")
          out_dir.mkdir(parents=True, exist_ok=True)

          def abi_from_path(path: Path) -> str:
            for part in path.parts:
              if part.startswith("abi-"):
                return part[4:]
            return "unscoped"

          snapshot_roots = []
          for p in sorted(out_dir.glob("abi-*/raw/build")):
            if p.exists():
              snapshot_roots.append((abi_from_path(p), p))
          search_roots = snapshot_roots if snapshot_roots else ([("unscoped", Path("build"))] if Path("build").exists() else [])

          def gather(pattern):
            files = []
            for abi_label, root in search_roots:
              files.extend((abi_label, p) for p in sorted(root.rglob(pattern)))
            return files

          def canonicalize_stage(stage: str) -> str:
            cleaned = " ".join((stage or "unknown").strip().split()) or "unknown"
            lowered = cleaned.lower()
            if "ptxas" in lowered:
              return "ptxas"
            return lowered

          UNIT_SCALE = {
            "ns": 1e-9,
            "us": 1e-6,
            "ms": 1e-3,
            "s": 1.0,
          }
          UNIT_ALIASES = {
            "ns": "ns",
            "nsec": "ns",
            "nsecs": "ns",
            "nanosecond": "ns",
            "nanoseconds": "ns",
            "us": "us",
            "usec": "us",
            "usecs": "us",
            "microsecond": "us",
            "microseconds": "us",
            "ms": "ms",
            "msec": "ms",
            "msecs": "ms",
            "millisecond": "ms",
            "milliseconds": "ms",
            "s": "s",
            "sec": "s",
            "secs": "s",
            "second": "s",
            "seconds": "s",
          }

          def canonical_unit_token(token: str):
            key = (token or "").strip().lower().replace("μ", "u").replace("µ", "u")
            key = key.strip("()[]{}:;,")
            if not key:
              return None
            return UNIT_ALIASES.get(key)

          def infer_time_unit(fieldname: str):
            key = (fieldname or "").strip().lower().replace("μ", "u").replace("µ", "u")
            for token in re.split(r"[^a-z0-9]+", key):
              unit = canonical_unit_token(token)
              if unit is not None:
                return unit, UNIT_SCALE[unit]
            return "unknown", None

          def parse_time_value(raw_value: str):
            text = (raw_value or "").strip()
            if not text:
              return None, None
            normalized = text.replace(",", "").replace("μ", "u").replace("µ", "u")
            m = re.match(r"^([+-]?(?:[0-9]+(?:[.][0-9]*)?|[.][0-9]+)(?:[eE][+-]?[0-9]+)?)[ \t]*([A-Za-z]*)$", normalized)
            if not m:
              return None, None
            try:
              value = float(m.group(1))
            except ValueError:
              return None, None
            return value, canonical_unit_token(m.group(2))

          nvcc_time_files = gather("*.nvcc_time.csv")
          trace_json_candidates = gather("*.json")
          fdevice_files = []
          tu_wall_files = gather("*.nvcc_walltime.txt")
          ninja_logs = gather(".ninja_log")
          setup_py_wall_files = sorted(out_dir.glob("setup_py_*.walltime.txt"))
          runtime_info_path = out_dir / "runtime_info.json"
          runtime_info = {}
          if runtime_info_path.exists():
            try:
              runtime_info = json.loads(runtime_info_path.read_text(encoding="utf-8"))
            except Exception:
              runtime_info = {}

          for _, p in trace_json_candidates:
            try:
              parsed = json.loads(p.read_text(encoding="utf-8", errors="ignore"))
            except Exception:
              continue
            if isinstance(parsed, dict) and isinstance(parsed.get("traceEvents"), list):
              fdevice_files.append(p)

          setup_py_walls = []
          for p in setup_py_wall_files:
            text = p.read_text(encoding="utf-8", errors="ignore")
            m = re.search(r"wall_s=([0-9]+(?:\\.[0-9]+)?)", text)
            if m:
              setup_py_walls.append({"file": str(p), "wall_s": float(m.group(1))})
          setup_py_walls.sort(key=lambda x: x["wall_s"], reverse=True)

          tu_wall = []
          for abi_label, p in tu_wall_files:
            text = p.read_text(encoding="utf-8", errors="ignore")
            m = re.search(r"wall_s=([0-9]+(?:\\.[0-9]+)?)", text)
            if not m:
              continue
            tu_wall.append({"abi": abi_label, "file": str(p), "wall_s": float(m.group(1))})
          tu_wall.sort(key=lambda x: x["wall_s"], reverse=True)

          ninja_entries = []
          for abi_label, log in ninja_logs:
            for line in log.read_text(encoding="utf-8", errors="ignore").splitlines():
              if not line or line.startswith("#"):
                continue
              parts = line.split("\t")
              if len(parts) < 3:
                continue
              try:
                start_ms = int(parts[0])
                end_ms = int(parts[1])
              except ValueError:
                continue
              output = parts[3] if len(parts) > 3 else parts[2]
              ninja_entries.append(
                {
                  "abi": abi_label,
                  "log": str(log),
                  "output": output,
                  "duration_s": max(0.0, (end_ms - start_ms) / 1000.0),
                }
              )
          ninja_entries.sort(key=lambda x: x["duration_s"], reverse=True)

          stage_totals_raw = {}
          stage_totals_s = {}
          stage_totals_by_abi_raw = {}
          stage_totals_by_abi_s = {}
          stage_totals_by_tu_raw = {}
          stage_totals_by_tu_s = {}
          ptxas_total_raw = 0.0
          ptxas_total_s = 0.0
          units_detected = {}
          nvcc_time_files_normalized = []
          nvcc_time_files_ambiguous = []
          nvcc_phase_rows = []
          rows_seconds_applied = 0
          parsed_rows = 0

          def pick_header(fieldnames, candidates):
            lowered = {k.lower(): k for k in (fieldnames or []) if k}
            for cand in candidates:
              for k_lower, k_orig in lowered.items():
                if cand in k_lower:
                  return k_orig
            return None

          for abi_label, p in nvcc_time_files:
            try:
              with p.open("r", encoding="utf-8", errors="ignore", newline="") as fh:
                reader = csv.DictReader(fh)
                if not reader.fieldnames:
                  continue
                stage_key = pick_header(reader.fieldnames, ["phase", "step", "activity", "tool", "name"])
                time_key = pick_header(reader.fieldnames, ["duration", "elapsed", "time", "metric", "ms"])
                unit_key = pick_header(reader.fieldnames, ["unit"])
                source_key = pick_header(reader.fieldnames, ["source file"])
                arch_key = pick_header(reader.fieldnames, ["arch"])
                phase_output_key = pick_header(reader.fieldnames, ["phase output file", "output file"])
                if not stage_key or not time_key:
                  continue
                header_unit_name, _ = infer_time_unit(time_key)
                header_unit = header_unit_name if header_unit_name != "unknown" else None
                abi = abi_label or abi_from_path(p)
                stage_totals_by_abi_raw.setdefault(abi, {})
                stage_totals_by_abi_s.setdefault(abi, {})
                stage_totals_by_tu_raw.setdefault(abi, {})
                stage_totals_by_tu_s.setdefault(abi, {})
                row_units = set()
                rows_without_explicit_unit = 0
                file_rows = []
                for row in reader:
                  stage = canonicalize_stage((row.get(stage_key) or "unknown"))
                  raw_val = (row.get(time_key) or "").strip()
                  source_name = (row.get(source_key) or "").strip() if source_key else ""
                  arch_name = " ".join((row.get(arch_key) or "").strip().split()) if arch_key else ""
                  phase_output = " ".join((row.get(phase_output_key) or "").strip().split()) if phase_output_key else ""
                  parsed_val, parsed_unit = parse_time_value(raw_val)
                  if parsed_unit is None and unit_key:
                    parsed_unit = canonical_unit_token(row.get(unit_key) or "")
                  if parsed_val is None:
                    try:
                      parsed_val = float(raw_val)
                    except ValueError:
                      continue
                  if parsed_unit is not None:
                    row_units.add(parsed_unit)
                  else:
                    rows_without_explicit_unit += 1
                  file_rows.append(
                    {
                      "stage": stage,
                      "metric_raw": parsed_val,
                      "source": source_name or str(p),
                      "arch": arch_name,
                      "phase_output": phase_output,
                    }
                  )

                if not file_rows:
                  continue

                effective_unit = None
                unit_reason = ""
                if len(row_units) > 1:
                  unit_reason = "mixed_row_units"
                elif len(row_units) == 1:
                  row_unit = next(iter(row_units))
                  if header_unit is None and rows_without_explicit_unit > 0:
                    unit_reason = "partial_row_units_missing_without_header"
                  elif header_unit is not None and header_unit != row_unit:
                    unit_reason = "header_row_unit_mismatch"
                  else:
                    effective_unit = row_unit
                elif header_unit is not None:
                  effective_unit = header_unit
                else:
                  unit_reason = "missing_unit"

                if effective_unit is not None:
                  units_detected[effective_unit] = units_detected.get(effective_unit, 0) + 1
                  nvcc_time_files_normalized.append(
                    {
                      "abi": abi,
                      "file": str(p),
                      "unit": effective_unit,
                      "rows": len(file_rows),
                    }
                  )
                  scale = UNIT_SCALE[effective_unit]
                else:
                  scale = None
                  nvcc_time_files_ambiguous.append(
                    {
                      "abi": abi,
                      "file": str(p),
                      "rows": len(file_rows),
                      "header_time_column": time_key,
                      "header_unit": header_unit_name,
                      "row_units": sorted(row_units),
                      "reason": unit_reason or "unknown",
                    }
                  )

                for row in file_rows:
                  stage = row["stage"]
                  t = row["metric_raw"]
                  source_name = row["source"]
                  parsed_rows += 1
                  stage_totals_raw[stage] = stage_totals_raw.get(stage, 0.0) + t
                  stage_totals_by_abi_raw[abi][stage] = stage_totals_by_abi_raw[abi].get(stage, 0.0) + t
                  stage_totals_by_tu_raw[abi].setdefault(source_name, {})
                  stage_totals_by_tu_raw[abi][source_name][stage] = stage_totals_by_tu_raw[abi][source_name].get(stage, 0.0) + t
                  phase_row = {
                    "abi": abi,
                    "time_file": str(p),
                    "source": source_name,
                    "stage": stage,
                    "arch": row["arch"],
                    "phase_output": row["phase_output"],
                    "metric_raw": t,
                    "unit": effective_unit or "",
                    "metric_s": None,
                  }
                  if scale is not None:
                    t_s = t * scale
                    rows_seconds_applied += 1
                    stage_totals_s[stage] = stage_totals_s.get(stage, 0.0) + t_s
                    stage_totals_by_abi_s[abi][stage] = stage_totals_by_abi_s[abi].get(stage, 0.0) + t_s
                    stage_totals_by_tu_s[abi].setdefault(source_name, {})
                    stage_totals_by_tu_s[abi][source_name][stage] = stage_totals_by_tu_s[abi][source_name].get(stage, 0.0) + t_s
                    phase_row["metric_s"] = t_s
                  nvcc_phase_rows.append(phase_row)
                  if stage == "ptxas":
                    ptxas_total_raw += t
                    if scale is not None:
                      ptxas_total_s += t * scale
            except Exception:
              continue

          seconds_coverage_ratio = (
            float(len(nvcc_time_files_normalized)) / float(len(nvcc_time_files))
            if nvcc_time_files
            else 1.0
          )

          stage_totals_by_abi_raw = {
            abi: sorted(totals.items(), key=lambda kv: kv[1], reverse=True)
            for abi, totals in stage_totals_by_abi_raw.items()
          }
          stage_totals_by_abi_s = {
            abi: sorted(totals.items(), key=lambda kv: kv[1], reverse=True)
            for abi, totals in stage_totals_by_abi_s.items()
          }
          top_tu_stage_totals_s = []
          stage_totals_by_tu_s_sorted = {}
          for abi, sources in stage_totals_by_tu_s.items():
            stage_totals_by_tu_s_sorted[abi] = {}
            for source_name, totals in sources.items():
              sorted_totals = sorted(totals.items(), key=lambda kv: kv[1], reverse=True)
              stage_totals_by_tu_s_sorted[abi][source_name] = sorted_totals
              top_tu_stage_totals_s.append(
                {
                  "abi": abi,
                  "source": source_name,
                  "total_s": sum(value for _, value in sorted_totals),
                  "stages": sorted_totals,
                }
              )
          top_tu_stage_totals_s.sort(key=lambda row: row["total_s"], reverse=True)
          nvcc_phase_rows_sorted = sorted(
            nvcc_phase_rows,
            key=lambda row: (
              row["metric_s"] if row["metric_s"] is not None else -1.0,
              row["metric_raw"],
            ),
            reverse=True,
          )

          phase_rows_csv = out_dir / "nvcc_time_rows.csv"
          with phase_rows_csv.open("w", encoding="utf-8", newline="") as fh:
            writer = csv.DictWriter(
              fh,
              fieldnames=[
                "abi",
                "time_file",
                "source",
                "stage",
                "arch",
                "phase_output",
                "metric_raw",
                "unit",
                "metric_s",
              ],
            )
            writer.writeheader()
            writer.writerows(nvcc_phase_rows_sorted)
          (out_dir / "nvcc_time_rows.json").write_text(
            json.dumps(nvcc_phase_rows_sorted, indent=2),
            encoding="utf-8",
          )

          summary = {
            "counts": {
              "profile_snapshot_roots": len(search_roots),
              "nvcc_time_files": len(nvcc_time_files),
              "nvcc_time_files_normalized": len(nvcc_time_files_normalized),
              "nvcc_time_files_ambiguous": len(nvcc_time_files_ambiguous),
              "fdevice_time_trace_files": len(fdevice_files),
              "tu_walltime_files": len(tu_wall_files),
              "ninja_logs": len(ninja_logs),
              "setup_py_walltime_files": len(setup_py_wall_files),
              "nvcc_time_rows_parsed": parsed_rows,
              "nvcc_time_rows_seconds_applied": rows_seconds_applied,
              "nvcc_time_rows_written": len(nvcc_phase_rows_sorted),
            },
            "runtime_info": runtime_info,
            "nvcc_time_units_detected": units_detected,
            "nvcc_time_seconds_coverage_ratio": seconds_coverage_ratio,
            "nvcc_time_unit_normalization_strict": len(nvcc_time_files_ambiguous) == 0,
            "nvcc_time_ambiguous_files": nvcc_time_files_ambiguous,
            "nvcc_time_normalized_files": nvcc_time_files_normalized,
            "setup_py_wall_s": setup_py_walls,
            "ptxas_total_from_nvcc_time_raw": ptxas_total_raw,
            "ptxas_total_from_nvcc_time_s": ptxas_total_s,
            "top_tu_wall_s": tu_wall[:20],
            "top_ninja_outputs_s": ninja_entries[:20],
            "nvcc_stage_totals_raw": sorted(stage_totals_raw.items(), key=lambda kv: kv[1], reverse=True),
            "nvcc_stage_totals_s": sorted(stage_totals_s.items(), key=lambda kv: kv[1], reverse=True),
            "nvcc_stage_totals_by_abi_raw": stage_totals_by_abi_raw,
            "nvcc_stage_totals_by_abi_s": stage_totals_by_abi_s,
            "top_nvcc_phase_rows_s": nvcc_phase_rows_sorted[:50],
            "top_nvcc_tu_stage_totals_s": top_tu_stage_totals_s[:20],
            "nvcc_stage_totals_by_tu_s": stage_totals_by_tu_s_sorted,
          }

          (out_dir / "summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")

          md = []
          md.append("# Build profiling summary")
          md.append("")
          if runtime_info:
            md.append(f"- runtime time binary: {runtime_info.get('time_bin', '') or 'missing'} ({runtime_info.get('time_bin_kind', 'unknown')})")
            md.append(f"- direct nvcc path: {runtime_info.get('nvcc_path', '') or 'missing'}")
            md.append(f"- ccache wrappers enabled: {runtime_info.get('use_ccache_wrappers', 'unknown')}")
          md.append(f"- setup.py walltime files: {len(setup_py_wall_files)}")
          md.append(f"- nvcc --time files: {len(nvcc_time_files)}")
          md.append(f"- fdevice time-trace files: {len(fdevice_files)}")
          md.append(f"- per-TU walltime files: {len(tu_wall_files)}")
          md.append(f"- ninja logs: {len(ninja_logs)}")
          md.append(f"- parsed nvcc --time rows: {parsed_rows}")
          md.append(f"- nvcc --time rows with normalized seconds: {rows_seconds_applied}")
          md.append(f"- normalized per-phase rows written: {len(nvcc_phase_rows_sorted)}")
          md.append(f"- detected nvcc --time units: {json.dumps(units_detected, sort_keys=True)}")
          md.append(f"- nvcc --time files with unambiguous units: {len(nvcc_time_files_normalized)}/{len(nvcc_time_files)}")
          md.append(f"- nvcc seconds coverage ratio: {seconds_coverage_ratio:.3f}")
          md.append(f"- ptxas total from nvcc --time (raw units): {ptxas_total_raw}")
          if ptxas_total_s:
            md.append(f"- ptxas total from nvcc --time (seconds): {ptxas_total_s:.6f}")
          if nvcc_time_files_ambiguous:
            md.append("")
            md.append("## NVCC unit normalization ambiguities")
            for row in nvcc_time_files_ambiguous[:20]:
              md.append(
                f"- {row['reason']}  header={row['header_unit']}  row_units={','.join(row['row_units']) or 'none'}  {row['file']}"
              )
          md.append("")
          md.append("## setup.py walltime by ABI")
          for row in setup_py_walls[:10]:
            md.append(f"- {row['wall_s']:.3f}s  {row['file']}")
          md.append("")
          md.append("## Top per-TU walltime")
          for row in tu_wall[:10]:
            md.append(f"- ABI {row['abi']}  {row['wall_s']:.3f}s  {row['file']}")
          md.append("")
          md.append("## Top Ninja edges")
          for row in ninja_entries[:10]:
            md.append(f"- ABI {row['abi']}  {row['duration_s']:.3f}s  {row['output']}")
          md.append("")
          md.append("## Top NVCC stages (raw units from nvcc --time)")
          for stage, value in sorted(stage_totals_raw.items(), key=lambda kv: kv[1], reverse=True)[:10]:
            md.append(f"- {value:.3f}  {stage}")
          if nvcc_phase_rows_sorted:
            md.append("")
            md.append("## Top exact NVCC phase rows (seconds)")
            for row in nvcc_phase_rows_sorted[:10]:
              if row["metric_s"] is None:
                continue
              md.append(
                f"- ABI {row['abi']}  {row['metric_s']:.6f}s  {row['stage']}  arch={row['arch'] or 'n/a'}  {row['source']}"
              )
          if stage_totals_by_abi_s:
            md.append("")
            md.append("## Top NVCC stages by ABI (seconds when unit-detectable)")
            for abi, totals in sorted(stage_totals_by_abi_s.items()):
              md.append(f"- ABI {abi}:")
              for stage, value in totals[:5]:
                md.append(f"  - {value:.6f}s  {stage}")
          if top_tu_stage_totals_s:
            md.append("")
            md.append("## Top NVCC per-TU totals (seconds)")
            for row in top_tu_stage_totals_s[:10]:
              md.append(f"- ABI {row['abi']}  {row['total_s']:.6f}s  {row['source']}")
            md.append("")
            md.append("## Per-TU NVCC stage breakdown (seconds)")
            for row in top_tu_stage_totals_s[:5]:
              md.append(f"- ABI {row['abi']}  {row['source']}:")
              for stage, value in row["stages"][:5]:
                md.append(f"  - {value:.6f}s  {stage}")
          md.append("")
          md.append("_Raw profiling artifacts are under build-profile/abi-<ABI>/raw. Normalized per-phase rows are in build-profile/nvcc_time_rows.{csv,json}._")

          summary_md = "\n".join(md) + "\n"
          (out_dir / "summary.md").write_text(summary_md, encoding="utf-8")

          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
            with open(step_summary, "a", encoding="utf-8") as fh:
              fh.write(summary_md)
          PY

      - name: Upload build profile artifact
        if: ${{ always() && !env.ACT && inputs.build-profile && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-profile-py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}-cxx11abi${{ inputs.cxx11_abi }}
          path: ${{ env.BUILD_WHEEL_DIR }}/build-profile
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ccache stats log
        if: ${{ always() && !env.ACT && inputs.enable-ccache && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ccache-statslog-py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}-cxx11abi${{ inputs.cxx11_abi }}
          path: ${{ env.CCACHE_STATSLOG }}
          if-no-files-found: warn
          retention-days: 14

      - name: Bundle ccache
        if: ${{ always() && !env.ACT && inputs.enable-ccache && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' }}
        run: |
          if [ -d "${CCACHE_DIR}" ]; then
            tar --use-compress-program="zstd -T0 -6" -cf /tmp/ccache-bundle.tar.zst -C "${CCACHE_DIR}" .
          fi

      - name: Upload ccache bundle artifact
        if: ${{ always() && !env.ACT && inputs.enable-ccache && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.ccache-bundle-artifact-name != '' && inputs.ccache-bundle-artifact-name || format('ccache-{0}-cu{1}-torch{2}-cxx11abi{3}', inputs.python-version, inputs.cuda-version, inputs.torch-version, inputs.cxx11_abi) }}
          path: /tmp/ccache-bundle.tar.zst
          if-no-files-found: ignore
          retention-days: 14

      - name: Save compatible ccache
        if: ${{ !env.ACT && inputs.enable-ccache && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' && steps.restore_ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache_key.outputs.key }}

      - name: Save pip download cache
        if: ${{ !env.ACT && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}

      - name: Log build logs after timeout
        if: always() && steps.build_wheel.outputs.build_exit_code == 124
        working-directory: ${{ env.BUILD_WHEEL_DIR }}
        run: |
          ls -al ./
          tar -cvf build.tar . --atime-preserve=replace

      - name: Test built wheel
        if: ${{ always() && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' && inputs.run-wheel-tests && steps.build_wheel.outputs.build_exit_code == '0' }}
        working-directory: ${{ env.BUILD_WHEEL_DIR }}
        run: |
          python3 -m pip install pytest numpy
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No built wheels found to test; skipping."
            exit 0
          fi
          for wheel in "${wheels[@]}"; do
            python3 -m pip uninstall -y lite_attention 2>/dev/null || true
            python3 -m pip install --force-reinstall "$wheel"
            pytest ${{ inputs.wheel-test-target }}
          done

      - name: Log Built Wheels
        if: steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true'
        working-directory: ${{ env.BUILD_WHEEL_DIR }}
        run: |
          ls dist

      - name: Upload wheel as artifact
        if: ${{ always() && !env.ACT && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' && steps.build_wheel.outputs.build_exit_code == '0' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-py${{ inputs.python-version }}-cu${{ inputs.cuda-version }}-torch${{ inputs.torch-version }}-${{ steps.abi_batch.outputs.artifact_label }}
          path: ${{ env.BUILD_WHEEL_DIR }}/dist/*.whl
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload wheel to Release
        if: ${{ !env.ACT && inputs.upload-to-release && steps.build_wheel.outputs.build_exit_code == '0' }}
        working-directory: ${{ env.BUILD_WHEEL_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-version }}
        run: |
          gh release upload ${{ env.RELEASE_TAG }} dist/*.whl --clobber

      - name: Skip note (incompatible combo)
        if: steps.py_compat.outputs.skip_build == 'true' || steps.torch_install.outputs.skip_build == 'true'
        run: |
          echo "Skipping build because Python/CUDA/PyTorch combination is incompatible."

      - name: Fail job if any ABI build failed
        if: ${{ always() && steps.py_compat.outputs.skip_build != 'true' && steps.torch_install.outputs.skip_build != 'true' && steps.build_wheel.outputs.build_exit_code != '0' }}
        run: |
          echo "::error::One or more ABI builds failed inside the batched build job."
          exit 1
