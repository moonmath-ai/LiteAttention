name: Release

on:
  workflow_dispatch:
    inputs:
      generate_videos:
        description: "Generate videos"
        required: true
        default: true
        type: boolean
      build_wheel:
        description: "Build wheels"
        required: true
        default: true
        type: boolean
      publish_package:
        description: "Publish package"
        required: true
        default: true
        type: boolean
      build_runner_labels_json:
        description: "Runner labels JSON for wheel builds"
        required: false
        default: "[\"self-hosted\",\"Linux\"]"
        type: string
      wheel_max_parallel:
        description: "Max concurrent wheel jobs (empty = repo/org variable or fallback)"
        required: false
        default: ""
        type: string
      gpu_runner_labels_json:
        description: "Runner labels JSON for video generation"
        required: false
        default: "[\"self-hosted\",\"gpu\"]"
        type: string
      release_runner_labels_json:
        description: "Runner labels JSON for release orchestration jobs"
        required: false
        default: "[\"self-hosted\",\"Linux\"]"
        type: string
      enable_ccache:
        description: "Enable ccache restore/save and bundling in wheel builds"
        required: false
        default: true
        type: boolean
      ccache_namespace:
        description: "Namespace segment for ccache keys"
        required: false
        default: "release"
        type: string
      run_wheel_tests:
        description: "Install built wheels and run lite_attention tests in build jobs"
        required: false
        default: true
        type: boolean
      wheel_test_target:
        description: "Pytest target for wheel validation"
        required: false
        default: "hopper/tests/test_lite_attention.py"
        type: string

jobs:
  get_release_tag:
    name: Get Release Tag
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    outputs:
      release_tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Validate ref is a tag and set release tag
        id: get_tag
        run: |
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "::error::This workflow must be run from a git tag. When using 'Run workflow', select a tag (e.g. v0.2.0) in the 'Use workflow from' dropdown."
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

  generate_videos:
    name: Generate videos for ${{ matrix.target }}
    needs: [get_release_tag]
    if: ${{ inputs.generate_videos }}
    runs-on: ${{ fromJSON(inputs.gpu_runner_labels_json) }}
    strategy:
      matrix:
        target: [ltx]
        include:
          - target: ltx
            repo_url: moonmath-ai/LTX-Video.git
            repo_name: LTX-Video
            branch: ci-lite-attention
            prompts_branch: ltx
            prompts_repo: moonmath-ai/ci-prompts-list.git
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
        with:
          app-id: ${{ secrets.CI_PULL_ID }}
          private-key: ${{ secrets.CI_PULL_SECRET }}
          owner: moonmath-ai

      - name: Checkout LiteAttention Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: LiteAttention

      - name: Checkout ${{ matrix.target }} Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch || 'main' }}
          path: ${{ matrix.repo_name }}
          submodules: 'recursive'
          lfs: true
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Checkout prompts list
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: ${{ matrix.repo_name }}-prompts
          repository: ${{ matrix.prompts_repo }}
          ref: ${{ matrix.prompts_branch }}
          lfs: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Build Docker image
        working-directory: ${{ matrix.repo_name }}
        run: |
          docker build --build-context lite=$(pwd)/../LiteAttention -t ${{ matrix.target }}:${{github.sha}} .

      - name: Run Video Generation in Docker container
        working-directory: ${{ matrix.repo_name }}
        run: |
          INPUT_PATH=$(pwd)/../${{ matrix.repo_name }}-prompts
          OUTPUT_PATH=$HOME/output/${{ matrix.target }}-${{github.sha}}
          if [ -n "${HF_HOME:-}" ]; then CACHE_DIR="${HF_HOME%/}/"; else CACHE_DIR="$HOME/.cache/"; fi
          echo "INPUT_PATH=$INPUT_PATH" >> $GITHUB_ENV
          echo "OUTPUT_PATH=$OUTPUT_PATH" >> $GITHUB_ENV
          echo "CACHE_DIR=$CACHE_DIR" >> $GITHUB_ENV
          mkdir -p $HOME/output/
          mkdir -p $OUTPUT_PATH
          mkdir -p $CACHE_DIR

          docker run --rm \
            --gpus all \
            --pid=host \
            --ipc=host \
            -e NCCL_P2P_DISABLE=1 \
            -e NCCL_IB_DISABLE=1 \
            -e NCCL_NET=Socket \
            -e NCCL_NVLS_ENABLE=0 \
            -v $INPUT_PATH:/input \
            -v $OUTPUT_PATH:/output \
            -v $CACHE_DIR:/root/.cache \
            ${{ matrix.target }}:${{github.sha }} \
            python3 inference_ci.py \
              --input_file /input/prompts.jsonl \
              --output_path /output \
              --videos_per_prompt ${{ vars.VIDEOS_PER_PROMPT || 1 }}

      - name: Upload generated videos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "${{ matrix.target }}-videos-${{ github.sha }}"
          path: ${{ env.OUTPUT_PATH }}
          retention-days: 30

      - name: Cleanup Docker images
        if: always()
        run: |
          docker rmi ${{ matrix.target }}:${{ github.sha }} || true

  create_draft_release:
    name: Create Draft Release
    needs: [get_release_tag]
    if: ${{ inputs.build_wheel || inputs.generate_videos }}
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: LiteAttention

      - name: Create Draft Release
        working-directory: LiteAttention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get_release_tag.outputs.release_tag }}
        run: |
          gh release create ${{ env.RELEASE_TAG }} --generate-notes -d --verify-tag -t "Release ${{ env.RELEASE_TAG }}"

  upload_videos_to_release:
    name: Upload videos to Release
    needs: [get_release_tag, create_draft_release, generate_videos]
    if: ${{ inputs.generate_videos }}
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: LiteAttention

      - name: Download All Video Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: LiteAttention/release-videos
          pattern: "*-videos-*"

      - name: Create example_videos archive
        working-directory: LiteAttention
        run: |
          mkdir -p example_videos
          # Move all downloaded artifact folders into example_videos
          find release-videos -mindepth 1 -maxdepth 1 -type d -exec mv {} example_videos/ \;
          # Create tar.gz archive
          tar -czf example_videos.tar.gz example_videos/
          echo "Archive contents:"
          tar -tzf example_videos.tar.gz | head -20

      - name: Upload example_videos archive to Release
        working-directory: LiteAttention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get_release_tag.outputs.release_tag }}
        run: |
          gh release upload ${{ env.RELEASE_TAG }} example_videos.tar.gz --clobber

  prepare_wheel_matrix:
    name: Prepare wheel matrix
    needs: [get_release_tag]
    if: ${{ inputs.build_wheel }}
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      max_parallel: ${{ steps.set.outputs.max_parallel }}
    steps:
      - name: Checkout Repository
        if: ${{ !env.ACT }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Generate supported wheel matrix
        id: set
        run: |
          python3 .github/scripts/generate_wheel_matrix.py
          max_parallel="${{ inputs.wheel_max_parallel }}"
          if [[ -z "$max_parallel" ]]; then
            max_parallel="${{ vars.LITE_ATTENTION_WHEEL_MATRIX_MAX_PARALLEL }}"
          fi
          if [[ -z "$max_parallel" ]]; then
            max_parallel="256"
          fi
          if ! [[ "$max_parallel" =~ ^[0-9]+$ ]] || (( max_parallel < 1 )); then
            echo "::error::wheel_max_parallel must be a positive integer (got '$max_parallel')"
            exit 1
          fi
          echo "max_parallel=$max_parallel" >> "$GITHUB_OUTPUT"
        env:
          PRESET: full

  build_wheels:
    name: Build Wheel
    needs: [get_release_tag, prepare_wheel_matrix]
    if: ${{ inputs.build_wheel }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.prepare_wheel_matrix.outputs.max_parallel) }}
      matrix: ${{ fromJson(needs.prepare_wheel_matrix.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      docker-image: nvidia/cuda:${{ matrix.cuda-version }}-${{ matrix.os-version }}
      python-version: ${{ matrix.python-version }}
      cuda-version: ${{ matrix.cuda-version }}
      torch-version: ${{ matrix.torch-version }}
      cxx11_abi: ${{ matrix.cxx11_abi }}
      runner-labels-json: ${{ inputs.build_runner_labels_json }}
      run-wheel-tests: ${{ inputs.run_wheel_tests }}
      wheel-test-target: ${{ inputs.wheel_test_target }}
      enable-ccache: ${{ inputs.enable_ccache }}
      ccache-namespace: ${{ inputs.ccache_namespace }}
      release-version: ${{ needs.get_release_tag.outputs.release_tag }}
      upload-to-release: false

  upload_wheels_to_release:
    name: Upload wheels to Release
    needs: [get_release_tag, create_draft_release, build_wheels]
    if: ${{ inputs.build_wheel }}
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: LiteAttention

      - name: Download wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: LiteAttention/release-wheels
          pattern: "wheel-py*"
          merge-multiple: true

      - name: Upload wheel artifacts to Release
        working-directory: LiteAttention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get_release_tag.outputs.release_tag }}
        run: |
          ls -1 release-wheels/*.whl
          gh release upload "${RELEASE_TAG}" release-wheels/*.whl --clobber

  publish_package:
    name: Publish package
    needs: [build_wheels, upload_wheels_to_release]
    if: ${{ inputs.publish_package }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: LiteAttention
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install ninja packaging wheel twine
          # Install latest setuptools with support for pypi metadata 2.2 (improved compat w/ uv)
          pip install setuptools==75.8.0
          # We don't want to download anything CUDA-related here
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build core package
        working-directory: LiteAttention
        env:
          LITE_ATTENTION_SKIP_CUDA_BUILD: "TRUE"
        run: |
          python setup.py sdist --dist-dir=dist
      - name: Deploy
        working-directory: LiteAttention
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*
