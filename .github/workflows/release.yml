name: Release

on:
  workflow_dispatch:
    inputs:
      generate_videos:
        description: "Generate videos"
        required: true
        default: true
        type: boolean
      build_wheel:
        description: "Build wheels"
        required: true
        default: true
        type: boolean
      publish_package:
        description: "Publish package"
        required: true
        default: true
        type: boolean
      build_runner_labels_json:
        description: "Runner labels JSON for wheel builds"
        required: false
        default: "[\"self-hosted\",\"Linux\"]"
        type: string
      wheel_host_shards_json:
        description: "Optional JSON array of host shards with runner_labels_json/max_parallel defaults"
        required: false
        default: ""
        type: string
      wheel_max_parallel:
        description: "Max concurrent wheel jobs (empty = repo/org variable or fallback)"
        required: false
        default: ""
        type: string
      gpu_runner_labels_json:
        description: "Runner labels JSON for video generation"
        required: false
        default: "[\"self-hosted\",\"gpu\"]"
        type: string
      release_runner_labels_json:
        description: "Runner labels JSON for release orchestration jobs"
        required: false
        default: "[\"self-hosted\",\"Linux\"]"
        type: string
      enable_ccache:
        description: "Enable ccache restore/save and bundling in wheel builds"
        required: false
        default: true
        type: boolean
      ccache_namespace:
        description: "Namespace segment for ccache keys"
        required: false
        default: "release"
        type: string
      run_wheel_tests:
        description: "Install built wheels and run lite_attention tests in build jobs"
        required: false
        default: true
        type: boolean
      wheel_test_target:
        description: "Pytest target for wheel validation"
        required: false
        default: "hopper/tests/test_lite_attention.py"
        type: string
      wheel_build_max_jobs:
        description: "Optional override for MAX_JOBS in each wheel build"
        required: false
        default: ""
        type: string
      wheel_nvcc_threads:
        description: "Optional override for NVCC_THREADS in each wheel build"
        required: false
        default: ""
        type: string
      wheel_nvcc_lineinfo:
        description: "Optional override for LITE_ATTENTION_NVCC_LINEINFO"
        required: false
        default: ""
        type: string
      wheel_nvcc_resource_usage:
        description: "Optional override for LITE_ATTENTION_NVCC_RESOURCE_USAGE"
        required: false
        default: ""
        type: string
      wheel_nvcc_split_compile:
        description: "Optional override for LITE_ATTENTION_NVCC_SPLIT_COMPILE"
        required: false
        default: ""
        type: string
      wheel_skip_nvcc_gen_dependencies:
        description: "Optional override for LITE_ATTENTION_SKIP_NVCC_GEN_DEPENDENCIES"
        required: false
        default: ""
        type: string
      batch_abi_wheels:
        description: "Batch TRUE/FALSE ABI wheels into one build job per python/cuda/torch tuple"
        required: false
        default: true
        type: boolean

jobs:
  get_release_tag:
    name: Get Release Tag
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    outputs:
      release_tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Validate ref is a tag and set release tag
        id: get_tag
        run: |
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "::error::This workflow must be run from a git tag. When using 'Run workflow', select a tag (e.g. v0.2.0) in the 'Use workflow from' dropdown."
            exit 1
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

  generate_videos:
    name: Generate videos for ${{ matrix.target }}
    needs: [get_release_tag]
    if: ${{ inputs.generate_videos }}
    runs-on: ${{ fromJSON(inputs.gpu_runner_labels_json) }}
    strategy:
      matrix:
        target: [ltx]
        include:
          - target: ltx
            repo_url: moonmath-ai/LTX-Video.git
            repo_name: LTX-Video
            branch: ci-lite-attention
            prompts_branch: ltx
            prompts_repo: moonmath-ai/ci-prompts-list.git
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42
        with:
          app-id: ${{ secrets.CI_PULL_ID }}
          private-key: ${{ secrets.CI_PULL_SECRET }}
          owner: moonmath-ai

      - name: Checkout LiteAttention Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: LiteAttention

      - name: Checkout ${{ matrix.target }} Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ matrix.repo_url }}
          ref: ${{ matrix.branch || 'main' }}
          path: ${{ matrix.repo_name }}
          submodules: 'recursive'
          lfs: true
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Checkout prompts list
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: ${{ matrix.repo_name }}-prompts
          repository: ${{ matrix.prompts_repo }}
          ref: ${{ matrix.prompts_branch }}
          lfs: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Build Docker image
        working-directory: ${{ matrix.repo_name }}
        run: |
          docker build --build-context lite=$(pwd)/../LiteAttention -t ${{ matrix.target }}:${{github.sha}} .

      - name: Run Video Generation in Docker container
        working-directory: ${{ matrix.repo_name }}
        run: |
          INPUT_PATH=$(pwd)/../${{ matrix.repo_name }}-prompts
          OUTPUT_PATH=$HOME/output/${{ matrix.target }}-${{github.sha}}
          if [ -n "${HF_HOME:-}" ]; then CACHE_DIR="${HF_HOME%/}/"; else CACHE_DIR="$HOME/.cache/"; fi
          echo "INPUT_PATH=$INPUT_PATH" >> $GITHUB_ENV
          echo "OUTPUT_PATH=$OUTPUT_PATH" >> $GITHUB_ENV
          echo "CACHE_DIR=$CACHE_DIR" >> $GITHUB_ENV
          mkdir -p $HOME/output/
          mkdir -p $OUTPUT_PATH
          mkdir -p $CACHE_DIR

          docker run --rm \
            --gpus all \
            --pid=host \
            --ipc=host \
            -e NCCL_P2P_DISABLE=1 \
            -e NCCL_IB_DISABLE=1 \
            -e NCCL_NET=Socket \
            -e NCCL_NVLS_ENABLE=0 \
            -v $INPUT_PATH:/input \
            -v $OUTPUT_PATH:/output \
            -v $CACHE_DIR:/root/.cache \
            ${{ matrix.target }}:${{github.sha }} \
            python3 inference_ci.py \
              --input_file /input/prompts.jsonl \
              --output_path /output \
              --videos_per_prompt ${{ vars.VIDEOS_PER_PROMPT || 1 }}

      - name: Upload generated videos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "${{ matrix.target }}-videos-${{ github.sha }}"
          path: ${{ env.OUTPUT_PATH }}
          retention-days: 30

      - name: Cleanup Docker images
        if: always()
        run: |
          docker rmi ${{ matrix.target }}:${{ github.sha }} || true

  create_draft_release:
    name: Create Draft Release
    needs: [get_release_tag]
    if: ${{ inputs.build_wheel || inputs.generate_videos }}
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: LiteAttention

      - name: Create Draft Release
        working-directory: LiteAttention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get_release_tag.outputs.release_tag }}
        run: |
          gh release create ${{ env.RELEASE_TAG }} --generate-notes -d --verify-tag -t "Release ${{ env.RELEASE_TAG }}"

  upload_videos_to_release:
    name: Upload videos to Release
    needs: [get_release_tag, create_draft_release, generate_videos]
    if: ${{ inputs.generate_videos }}
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: LiteAttention

      - name: Download All Video Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: LiteAttention/release-videos
          pattern: "*-videos-*"

      - name: Create example_videos archive
        working-directory: LiteAttention
        run: |
          mkdir -p example_videos
          # Move all downloaded artifact folders into example_videos
          find release-videos -mindepth 1 -maxdepth 1 -type d -exec mv {} example_videos/ \;
          # Create tar.gz archive
          tar -czf example_videos.tar.gz example_videos/
          echo "Archive contents:"
          tar -tzf example_videos.tar.gz | head -20

      - name: Upload example_videos archive to Release
        working-directory: LiteAttention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get_release_tag.outputs.release_tag }}
        run: |
          gh release upload ${{ env.RELEASE_TAG }} example_videos.tar.gz --clobber

  prepare_wheel_matrix:
    name: Prepare wheel matrix
    needs: [get_release_tag]
    if: ${{ inputs.build_wheel }}
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      max_parallel: ${{ steps.set.outputs.max_parallel }}
    steps:
      - name: Checkout Repository
        if: ${{ !env.ACT }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Generate supported wheel matrix
        id: set
        run: |
          raw_matrix="$(env -u GITHUB_OUTPUT python3 .github/scripts/generate_wheel_matrix.py)"
          grouped_matrix="$(RAW_MATRIX="$raw_matrix" BATCH_ABI="${{ inputs.batch_abi_wheels }}" python3 - <<'PY'
          import itertools
          import json
          import os

          GROUP_KEYS = ("os-version", "python-version", "cuda-version", "torch-version")
          ABI_KEYS = {"cxx11_abi", "cxx11_abi_list"}

          matrix = json.loads(os.environ["RAW_MATRIX"])

          if "include" in matrix:
              entries = matrix["include"]
          else:
              axes = {
                  "os-version": matrix.get("os-version", []),
                  "python-version": matrix.get("python-version", []),
                  "cuda-version": matrix.get("cuda-version", []),
                  "torch-version": matrix.get("torch-version", []),
                  "cxx11_abi": matrix.get("cxx11_abi", []),
              }
              entries = [
                  {
                      "os-version": os_version,
                      "python-version": python_version,
                      "cuda-version": cuda_version,
                      "torch-version": torch_version,
                      "cxx11_abi": cxx11_abi,
                  }
                  for os_version, python_version, cuda_version, torch_version, cxx11_abi
                  in itertools.product(
                      axes["os-version"],
                      axes["python-version"],
                      axes["cuda-version"],
                      axes["torch-version"],
                      axes["cxx11_abi"],
                  )
              ]

          batch_abi = os.environ.get("BATCH_ABI", "").lower() == "true"
          abi_order = {"FALSE": 0, "TRUE": 1}
          if batch_abi:
              grouped = {}
              for entry in entries:
                  key = tuple(entry[k] for k in GROUP_KEYS)
                  grouped_entry = grouped.setdefault(
                      key,
                      {
                          **{k: v for k, v in entry.items() if k not in ABI_KEYS},
                          "cxx11_abi_list": [],
                      },
                  )
                  for extra_key, extra_value in entry.items():
                      if extra_key in ABI_KEYS:
                          continue
                      if extra_key not in grouped_entry:
                          grouped_entry[extra_key] = extra_value
                      elif grouped_entry[extra_key] != extra_value:
                          raise SystemExit(
                              f"Cannot batch entries with conflicting '{extra_key}' values for tuple {key}: "
                              f"{grouped_entry[extra_key]!r} vs {extra_value!r}"
                          )
                  abi_values = entry.get("cxx11_abi_list")
                  if abi_values is None:
                      abi_values = [entry["cxx11_abi"]]
                  for abi in abi_values:
                      abi = str(abi)
                      if abi not in grouped_entry["cxx11_abi_list"]:
                          grouped_entry["cxx11_abi_list"].append(abi)
              include = list(grouped.values())
          else:
              include = []
              for entry in entries:
                  normalized = dict(entry)
                  abi_values = normalized.get("cxx11_abi_list")
                  if abi_values is None:
                      abi_values = [normalized["cxx11_abi"]]
                  normalized["cxx11_abi_list"] = [str(abi) for abi in abi_values]
                  include.append(normalized)

          for entry in include:
              entry["cxx11_abi_list"].sort(key=lambda abi: (abi_order.get(abi, 99), abi))

          print(json.dumps({"include": include}, separators=(",", ":")))
          PY
          )"
          grouped_matrix="$(GROUPED_MATRIX="$grouped_matrix" HOST_SHARDS_JSON_INPUT="${HOST_SHARDS_JSON_INPUT}" python3 - <<'PY'
          import json
          import os

          matrix = json.loads(os.environ["GROUPED_MATRIX"])
          entries = [dict(entry) for entry in (matrix.get("include") or [])]
          host_shards_raw = os.environ.get("HOST_SHARDS_JSON_INPUT", "").strip()

          def row_sort_key(row):
              abi_values = row.get("cxx11_abi_list")
              if abi_values is None:
                  abi_values = [row.get("cxx11_abi", "")]
              abi_key = ",".join(str(abi) for abi in abi_values)
              return (
                  str(row.get("os-version", "")),
                  str(row.get("cuda-version", "")),
                  str(row.get("torch-version", "")),
                  str(row.get("python-version", "")),
                  abi_key,
              )

          entries.sort(key=row_sort_key)

          if host_shards_raw:
              parsed = json.loads(host_shards_raw)
              if not isinstance(parsed, list) or not parsed:
                  raise SystemExit("wheel_host_shards_json must decode to a non-empty JSON array")
              host_shards = []
              seen_shard_names = set()
              for idx, shard in enumerate(parsed):
                  if not isinstance(shard, dict):
                      raise SystemExit(f"wheel_host_shards_json entry #{idx} must be an object")
                  shard_name = str(shard.get("name") or f"host{idx+1}")
                  if shard_name in seen_shard_names:
                      raise SystemExit(f"wheel_host_shards_json entry #{idx} has duplicate name '{shard_name}'")
                  seen_shard_names.add(shard_name)
                  runner_labels_json = shard.get("runner_labels_json")
                  if not isinstance(runner_labels_json, str) or not runner_labels_json.strip():
                      raise SystemExit(f"wheel_host_shards_json entry #{idx} is missing non-empty runner_labels_json")
                  labels = json.loads(runner_labels_json)
                  if not isinstance(labels, list) or not all(isinstance(label, str) and label for label in labels):
                      raise SystemExit(f"wheel_host_shards_json entry #{idx} runner_labels_json must decode to a non-empty string array")
                  host_shards.append(
                      {
                          "name": shard_name,
                          "runner_labels_json": runner_labels_json,
                      }
                  )

              assigned = []
              for idx, entry in enumerate(entries):
                  shard = host_shards[idx % len(host_shards)]
                  assigned_entry = dict(entry)
                  assigned_entry["host_shard"] = shard["name"]
                  assigned_entry["runner_labels_json"] = shard["runner_labels_json"]
                  assigned.append(assigned_entry)
              entries = assigned

          print(json.dumps({"include": entries}, separators=(",", ":")))
          PY
          )"
          echo "matrix=${grouped_matrix}" >> "$GITHUB_OUTPUT"
          max_parallel="${{ inputs.wheel_max_parallel }}"
          if [[ -z "$max_parallel" ]]; then
            host_shard_default="$(HOST_SHARDS_JSON_INPUT="${HOST_SHARDS_JSON_INPUT}" python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("HOST_SHARDS_JSON_INPUT", "").strip()
          if not raw:
              raise SystemExit(0)

          shards = json.loads(raw)
          total = 0
          for shard in shards:
              total += int(shard.get("max_parallel", 1))
          print(total)
          PY
            )"
            max_parallel="${host_shard_default}"
          fi
          if [[ -z "$max_parallel" ]]; then
            max_parallel="${{ vars.LITE_ATTENTION_WHEEL_MATRIX_MAX_PARALLEL }}"
          fi
          if [[ -z "$max_parallel" ]]; then
            max_parallel="6"
          fi
          if ! [[ "$max_parallel" =~ ^[0-9]+$ ]] || (( max_parallel < 1 )); then
            echo "::error::wheel_max_parallel must be a positive integer (got '$max_parallel')"
            exit 1
          fi
          echo "max_parallel=$max_parallel" >> "$GITHUB_OUTPUT"
        env:
          PRESET: full
          HOST_SHARDS_JSON_INPUT: ${{ inputs.wheel_host_shards_json || vars.LITE_ATTENTION_WHEEL_HOST_SHARDS_JSON }}

  build_wheels:
    name: Build Wheel
    needs: [get_release_tag, prepare_wheel_matrix]
    if: ${{ inputs.build_wheel }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.prepare_wheel_matrix.outputs.max_parallel) }}
      matrix: ${{ fromJson(needs.prepare_wheel_matrix.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      docker-image: nvidia/cuda:${{ matrix.cuda-version }}-${{ matrix.os-version }}
      python-version: ${{ matrix.python-version }}
      cuda-version: ${{ matrix.cuda-version }}
      torch-version: ${{ matrix.torch-version }}
      cxx11_abi: ${{ join(matrix.cxx11_abi_list, '_') }}
      cxx11_abi_list_json: ${{ toJSON(matrix.cxx11_abi_list) }}
      runner-labels-json: ${{ matrix.runner_labels_json || inputs.build_runner_labels_json }}
      run-wheel-tests: ${{ inputs.run_wheel_tests }}
      wheel-test-target: ${{ inputs.wheel_test_target }}
      enable-ccache: ${{ inputs.enable_ccache }}
      ccache-namespace: ${{ inputs.ccache_namespace }}
      build-max-jobs: ${{ inputs.wheel_build_max_jobs }}
      nvcc-threads: ${{ inputs.wheel_nvcc_threads }}
      nvcc-lineinfo: ${{ inputs.wheel_nvcc_lineinfo }}
      nvcc-resource-usage: ${{ inputs.wheel_nvcc_resource_usage }}
      nvcc-split-compile: ${{ inputs.wheel_nvcc_split_compile }}
      skip-nvcc-gen-dependencies: ${{ inputs.wheel_skip_nvcc_gen_dependencies }}
      release-version: ${{ needs.get_release_tag.outputs.release_tag }}
      upload-to-release: false

  upload_wheels_to_release:
    name: Upload wheels to Release
    needs: [get_release_tag, create_draft_release, build_wheels]
    if: ${{ inputs.build_wheel }}
    runs-on: ${{ fromJSON(inputs.release_runner_labels_json) }}
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: LiteAttention

      - name: Download wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: LiteAttention/release-wheels
          pattern: "wheel-py*"
          merge-multiple: true

      - name: Upload wheel artifacts to Release
        working-directory: LiteAttention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.get_release_tag.outputs.release_tag }}
        run: |
          ls -1 release-wheels/*.whl
          gh release upload "${RELEASE_TAG}" release-wheels/*.whl --clobber

  publish_package:
    name: Publish package
    needs: [build_wheels, upload_wheels_to_release]
    if: ${{ inputs.publish_package }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          path: LiteAttention
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install ninja packaging wheel twine
          # Install latest setuptools with support for pypi metadata 2.2 (improved compat w/ uv)
          pip install setuptools==75.8.0
          # We don't want to download anything CUDA-related here
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build core package
        working-directory: LiteAttention
        env:
          LITE_ATTENTION_SKIP_CUDA_BUILD: "TRUE"
        run: |
          python setup.py sdist --dist-dir=dist
      - name: Deploy
        working-directory: LiteAttention
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*
