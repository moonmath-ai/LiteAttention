# Manually trigger a matrix of wheel builds with customizable axes.
name: Manual Matrix Build

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Matrix preset"
        required: true
        default: "full"
        type: choice
        options:
          - custom
          - full
          - matrix-48
          - bleeding-edge
      python-versions:
        description: "Comma-separated Python versions (e.g. 3.9,3.10,3.11)"
        required: false
        default: "3.9,3.10,3.11,3.12,3.13"
        type: string
      cuda-versions:
        description: "Comma-separated CUDA versions (e.g. 12.4.1,12.8.1)"
        required: false
        default: "12.4.1,12.8.1,12.9.1,13.0.0,13.0.1,13.0.2,13.1.0,13.1.1"
        type: string
      torch-versions:
        description: "Comma-separated PyTorch versions (e.g. 2.4.0,2.7.1)"
        required: false
        default: "2.4.0,2.7.1,2.8.0,2.9.1,2.10.0"
        type: string
      cxx11-abi:
        description: "Comma-separated C++11 ABI flags (TRUE,FALSE)"
        required: false
        default: "FALSE,TRUE"
        type: string
      os-version:
        description: "Comma-separated CUDA image OS suffixes (e.g. devel-ubuntu22.04)"
        required: false
        default: "devel-ubuntu22.04"
        type: string
      runner-labels-json:
        description: "Runner labels JSON (e.g. [\"self-hosted\",\"Linux\"])"
        required: false
        default: "[\"self-hosted\",\"Linux\"]"
        type: string
      host-shards-json:
        description: "Optional JSON array of host shards with runner_labels_json/max_parallel defaults"
        required: false
        default: ""
        type: string
      max-parallel:
        description: "Max concurrent wheel jobs (empty = repo/org variable or fallback)"
        required: false
        default: ""
        type: string
      run-wheel-tests:
        description: "Install built wheel and run lite_attention tests"
        required: false
        default: true
        type: boolean
      wheel-test-target:
        description: "Pytest target for wheel validation"
        required: false
        default: "hopper/tests/test_lite_attention.py"
        type: string
      enable-ccache:
        description: "Enable ccache restore/save and bundle artifact"
        required: false
        default: true
        type: boolean
      ccache-namespace:
        description: "Namespace segment for ccache keys"
        required: false
        default: "manual-matrix"
        type: string
      ccache-restore-mode:
        description: "ccache restore strictness: compatible (cross-python), python, exact"
        required: false
        default: "compatible"
        type: choice
        options:
          - compatible
          - python
          - exact
      seed-ccache-before-matrix:
        description: "Run one seed build first and import its ccache bundle into all matrix jobs"
        required: false
        default: false
        type: boolean
      import-ccache-artifact:
        description: "Optional artifact name containing ccache-bundle.tar.zst to import before each build job"
        required: false
        default: ""
        type: string
      import-ccache-bundle-path:
        description: "Optional direct path to a ccache-bundle.tar.zst file (for local act/manual testing)"
        required: false
        default: ""
        type: string
      build-profile:
        description: "Enable detailed NVCC/Ninja profiling artifacts and summary"
        required: false
        default: false
        type: boolean
      build-max-jobs:
        description: "Optional override for MAX_JOBS in each wheel build"
        required: false
        default: ""
        type: string
      nvcc-threads:
        description: "Optional override for NVCC_THREADS in each wheel build"
        required: false
        default: ""
        type: string
      nvcc-lineinfo:
        description: "Optional override for LITE_ATTENTION_NVCC_LINEINFO"
        required: false
        default: ""
        type: string
      nvcc-resource-usage:
        description: "Optional override for LITE_ATTENTION_NVCC_RESOURCE_USAGE"
        required: false
        default: ""
        type: string
      nvcc-split-compile:
        description: "Optional override for LITE_ATTENTION_NVCC_SPLIT_COMPILE"
        required: false
        default: ""
        type: string
      skip-nvcc-gen-dependencies:
        description: "Optional override for LITE_ATTENTION_SKIP_NVCC_GEN_DEPENDENCIES"
        required: false
        default: ""
        type: string
      matrix-json:
        description: "Optional JSON matrix object (overrides axis inputs)"
        required: false
        default: ""
        type: string
        # Example (single bleeding-edge wheel):
        # {"include":[{"os-version":"devel-ubuntu22.04","python-version":"3.12","cuda-version":"13.1.1","torch-version":"2.10.0","cxx11_abi":"FALSE"}]}
      upload-to-release:
        description: "Upload wheels to a release"
        required: false
        default: false
        type: boolean
      release-tag:
        description: "Release tag to upload to (required if upload-to-release is true)"
        required: false
        type: string

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      release_version: ${{ steps.set.outputs.release_version }}
      max_parallel: ${{ steps.set.outputs.max_parallel }}
      seed_matrix: ${{ steps.set.outputs.seed_matrix }}
      fanout_matrix: ${{ steps.set.outputs.fanout_matrix }}
    steps:
      - name: Checkout Repository
        if: ${{ !env.ACT }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set matrix and release version
        id: set
        run: |
          if [[ "${{ inputs.upload-to-release }}" == "true" && -z "${{ inputs.release-tag }}" ]]; then
            echo "::error::release-tag is required when upload-to-release is true"
            exit 1
          fi
          if [[ -n "${MATRIX_JSON_INPUT}" ]]; then
            raw_matrix="${MATRIX_JSON_INPUT}"
          else
            raw_matrix="$(env -u GITHUB_OUTPUT python3 .github/scripts/generate_wheel_matrix.py)"
          fi
          grouped_matrix="$(RAW_MATRIX="$raw_matrix" python3 - <<'PY'
          import itertools
          import json
          import os

          GROUP_KEYS = ("os-version", "python-version", "cuda-version", "torch-version")
          ABI_KEYS = {"cxx11_abi", "cxx11_abi_list"}

          matrix = json.loads(os.environ["RAW_MATRIX"])

          if "include" in matrix:
              entries = matrix["include"]
          else:
              axes = {
                  "os-version": matrix.get("os-version", []),
                  "python-version": matrix.get("python-version", []),
                  "cuda-version": matrix.get("cuda-version", []),
                  "torch-version": matrix.get("torch-version", []),
                  "cxx11_abi": matrix.get("cxx11_abi", []),
              }
              entries = [
                  {
                      "os-version": os_version,
                      "python-version": python_version,
                      "cuda-version": cuda_version,
                      "torch-version": torch_version,
                      "cxx11_abi": cxx11_abi,
                  }
                  for os_version, python_version, cuda_version, torch_version, cxx11_abi
                  in itertools.product(
                      axes["os-version"],
                      axes["python-version"],
                      axes["cuda-version"],
                      axes["torch-version"],
                      axes["cxx11_abi"],
                  )
              ]

          abi_order = {"FALSE": 0, "TRUE": 1}
          grouped = {}
          for entry in entries:
              key = tuple(entry[k] for k in GROUP_KEYS)
              grouped_entry = grouped.setdefault(
                  key,
                  {
                      **{k: v for k, v in entry.items() if k not in ABI_KEYS},
                      "cxx11_abi_list": [],
                  },
              )
              for extra_key, extra_value in entry.items():
                  if extra_key in ABI_KEYS:
                      continue
                  if extra_key not in grouped_entry:
                      grouped_entry[extra_key] = extra_value
                  elif grouped_entry[extra_key] != extra_value:
                      raise SystemExit(
                          f"Cannot batch entries with conflicting '{extra_key}' values for tuple {key}: "
                          f"{grouped_entry[extra_key]!r} vs {extra_value!r}"
                      )
              abi_values = entry.get("cxx11_abi_list")
              if abi_values is None:
                  abi_values = [entry["cxx11_abi"]]
              for abi in abi_values:
                  abi = str(abi)
                  if abi not in grouped_entry["cxx11_abi_list"]:
                      grouped_entry["cxx11_abi_list"].append(abi)

          include = list(grouped.values())

          for entry in include:
              entry["cxx11_abi_list"].sort(key=lambda abi: (abi_order.get(abi, 99), abi))

          print(json.dumps({"include": include}, separators=(",", ":")))
          PY
          )"
          GROUPED_MATRIX="$grouped_matrix" python3 - <<'PY'
          import json
          import os

          def py_sort_key(ver: str):
              parts = ver.split(".")
              major = int(parts[0]) if len(parts) > 0 and parts[0].isdigit() else 0
              minor = int(parts[1]) if len(parts) > 1 and parts[1].isdigit() else 0
              return (major, minor, ver)

          def seed_priority(ver: str):
              # Prefer cp310 seed jobs for broad wheel coverage, then lowest available.
              return (0, 0, ver) if ver == "3.10" else (1, *py_sort_key(ver))

          def normalize_namespace(raw: str) -> str:
              value = (raw or "").strip()
              return value or "manual-matrix"

          def image_id_for_row(row: dict) -> str:
              image = f"nvidia/cuda:{row['cuda-version']}-{row['os-version']}"
              translated = image.translate(str.maketrans({"/": "-", ":": "-", ".": "-"}))
              return "".join(ch for ch in translated if (ch.isalnum() or ch in "_-"))

          def row_abi_label(row: dict) -> str:
              if row.get("cxx11_abi"):
                  return str(row["cxx11_abi"])
              abi_values = row.get("cxx11_abi_list")
              if abi_values is None:
                  abi_values = [row.get("cxx11_abi", "")]
              normalized = [str(abi) for abi in abi_values if str(abi)]
              return "_".join(normalized)

          def ccache_seed_artifact_name(row: dict, namespace: str) -> str:
              return (
                  f"ccache-{namespace}-{image_id_for_row(row)}"
                  f"-py{row['python-version']}"
                  f"-cu{row['cuda-version']}"
                  f"-torch{row['torch-version']}"
                  f"-cxx11abi{row_abi_label(row)}"
              )

          matrix = json.loads(os.environ["GROUPED_MATRIX"])
          entries = [dict(entry) for entry in (matrix.get("include") or [])]
          seed_enabled = os.environ.get("SEED_ENABLED", "").lower() == "true"
          ccache_namespace = normalize_namespace(os.environ.get("CCACHE_NAMESPACE_INPUT", ""))
          host_shards_raw = os.environ.get("HOST_SHARDS_JSON_INPUT", "").strip()

          def row_sort_key(row):
              abi_values = row.get("cxx11_abi_list")
              if abi_values is None:
                  abi_values = [row.get("cxx11_abi", "")]
              abi_key = ",".join(str(abi) for abi in abi_values)
              return (
                  str(row.get("os-version", "")),
                  str(row.get("cuda-version", "")),
                  str(row.get("torch-version", "")),
                  str(row.get("python-version", "")),
                  abi_key,
              )

          entries.sort(key=row_sort_key)
          for row in entries:
              row["ccache_bundle_artifact"] = ccache_seed_artifact_name(row, ccache_namespace)

          host_shards = []
          if host_shards_raw:
              parsed = json.loads(host_shards_raw)
              if not isinstance(parsed, list) or not parsed:
                  raise SystemExit("host-shards-json must decode to a non-empty JSON array")
              seen_shard_names = set()
              for idx, shard in enumerate(parsed):
                  if not isinstance(shard, dict):
                      raise SystemExit(f"host-shards-json entry #{idx} must be an object")
                  shard_name = str(shard.get("name") or f"host{idx+1}")
                  if shard_name in seen_shard_names:
                      raise SystemExit(f"host-shards-json entry #{idx} has duplicate name '{shard_name}'")
                  seen_shard_names.add(shard_name)
                  runner_labels_json = shard.get("runner_labels_json")
                  if not isinstance(runner_labels_json, str) or not runner_labels_json.strip():
                      raise SystemExit(f"host-shards-json entry #{idx} is missing non-empty runner_labels_json")
                  try:
                      labels = json.loads(runner_labels_json)
                  except Exception as exc:
                      raise SystemExit(f"host-shards-json entry #{idx} has invalid runner_labels_json: {exc}") from exc
                  if not isinstance(labels, list) or not all(isinstance(label, str) and label for label in labels):
                      raise SystemExit(f"host-shards-json entry #{idx} runner_labels_json must decode to a non-empty string array")
                  max_parallel = shard.get("max_parallel", 1)
                  try:
                      max_parallel = int(max_parallel)
                  except Exception as exc:
                      raise SystemExit(f"host-shards-json entry #{idx} has invalid max_parallel: {exc}") from exc
                  if max_parallel < 1:
                      raise SystemExit(f"host-shards-json entry #{idx} max_parallel must be >= 1")
                  host_shards.append(
                      {
                          "name": shard_name,
                          "runner_labels_json": runner_labels_json,
                          "max_parallel": max_parallel,
                      }
                  )

          shard_assignment_pool = []
          for shard in host_shards:
              shard_assignment_pool.extend([shard] * int(shard["max_parallel"]))

          def assign_host_shards(rows):
              if not host_shards:
                  return [dict(row) for row in rows]
              assigned = []
              for idx, row in enumerate(rows):
                  shard = shard_assignment_pool[idx % len(shard_assignment_pool)]
                  assigned_row = dict(row)
                  assigned_row["host_shard"] = shard["name"]
                  assigned_row["runner_labels_json"] = shard["runner_labels_json"]
                  assigned.append(assigned_row)
              return assigned

          seed_matrix = {"include": []}
          fanout_matrix = {"include": assign_host_shards(entries)}

          if seed_enabled and entries:
              normalized_entries = []
              for entry in entries:
                  row = dict(entry)
                  abi_values = row.get("cxx11_abi_list")
                  if abi_values is None:
                      abi_values = [row.get("cxx11_abi", "")]
                  abi_values = [str(abi) for abi in abi_values if str(abi)]
                  if not abi_values:
                      raise SystemExit("Resolved matrix entry has no ABI values")
                  row["cxx11_abi_list"] = abi_values
                  row["cxx11_abi"] = "_".join(abi_values)
                  normalized_entries.append(row)

              # Cohort key intentionally excludes python so one seed can fan out to all pythons.
              cohorts = {}
              for row in normalized_entries:
                  key = (
                      str(row["os-version"]),
                      str(row["cuda-version"]),
                      str(row["torch-version"]),
                      str(row["cxx11_abi"]),
                  )
                  cohorts.setdefault(key, []).append(row)

              selected_seed_keys = set()
              seed_rows = []
              fanout_rows = []
              for key in sorted(cohorts):
                  cohort_rows = cohorts[key]
                  seed_row = min(
                      cohort_rows,
                      key=lambda r: seed_priority(str(r["python-version"])),
                  )
                  selected_key = (
                      str(seed_row["os-version"]),
                      str(seed_row["python-version"]),
                      str(seed_row["cuda-version"]),
                      str(seed_row["torch-version"]),
                      str(seed_row["cxx11_abi"]),
                  )
                  selected_seed_keys.add(selected_key)
                  artifact = str(seed_row["ccache_bundle_artifact"])
                  seed_row["seed_ccache_artifact"] = artifact
                  seed_rows.append(seed_row)

                  for row in cohort_rows:
                      row_key = (
                          str(row["os-version"]),
                          str(row["python-version"]),
                          str(row["cuda-version"]),
                          str(row["torch-version"]),
                          str(row["cxx11_abi"]),
                      )
                      if row_key in selected_seed_keys:
                          continue
                      fanout_row = dict(row)
                      fanout_row["seed_ccache_artifact"] = artifact
                      fanout_rows.append(fanout_row)

              seed_matrix = {"include": assign_host_shards(seed_rows)}
              fanout_matrix = {"include": assign_host_shards(fanout_rows)}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps({'include': assign_host_shards(entries)}, separators=(',', ':'))}\n")
              fh.write(f"seed_matrix={json.dumps(seed_matrix, separators=(',', ':'))}\n")
              fh.write(f"fanout_matrix={json.dumps(fanout_matrix, separators=(',', ':'))}\n")
          PY
          if [[ "${{ inputs.upload-to-release }}" == "true" ]]; then
            echo "release_version=${{ inputs.release-tag }}" >> $GITHUB_OUTPUT
          else
            echo "release_version=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi
          max_parallel="${{ inputs.max-parallel }}"
          if [[ -z "$max_parallel" ]]; then
            host_shard_default="$(HOST_SHARDS_JSON_INPUT="${HOST_SHARDS_JSON_INPUT}" python3 - <<'PY'
          import json
          import os

          raw = os.environ.get("HOST_SHARDS_JSON_INPUT", "").strip()
          if not raw:
              raise SystemExit(0)

          shards = json.loads(raw)
          total = 0
          for shard in shards:
              total += int(shard.get("max_parallel", 1))
          print(total)
          PY
            )"
            max_parallel="${host_shard_default}"
          fi
          if [[ -z "$max_parallel" ]]; then
            max_parallel="${{ vars.LITE_ATTENTION_WHEEL_MATRIX_MAX_PARALLEL }}"
          fi
          if [[ -z "$max_parallel" ]]; then
            max_parallel="6"
          fi
          if ! [[ "$max_parallel" =~ ^[0-9]+$ ]] || (( max_parallel < 1 )); then
            echo "::error::max-parallel must be a positive integer (got '$max_parallel')"
            exit 1
          fi
          echo "max_parallel=$max_parallel" >> "$GITHUB_OUTPUT"
        env:
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          CUDA_VERSIONS: ${{ inputs.cuda-versions }}
          TORCH_VERSIONS: ${{ inputs.torch-versions }}
          CXX11_ABI: ${{ inputs.cxx11-abi }}
          OS_VERSION: ${{ inputs.os-version }}
          PRESET: ${{ inputs.preset }}
          MATRIX_JSON_INPUT: ${{ inputs.matrix-json }}
          SEED_ENABLED: ${{ inputs.seed-ccache-before-matrix }}
          CCACHE_NAMESPACE_INPUT: ${{ inputs.ccache-namespace }}
          HOST_SHARDS_JSON_INPUT: ${{ inputs.host-shards-json || vars.LITE_ATTENTION_WHEEL_HOST_SHARDS_JSON }}

  prefetch-images:
    name: Prefetch docker images
    needs: prepare
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    steps:
      - name: Pull unique matrix images
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        run: |
          python3 - <<'PY' >/tmp/manual-matrix-images.txt
          import json
          import os

          matrix = json.loads(os.environ["MATRIX_JSON"])
          images = []

          if "include" in matrix:
              for entry in matrix["include"]:
                  image = f"nvidia/cuda:{entry['cuda-version']}-{entry['os-version']}"
                  if image not in images:
                      images.append(image)
          else:
              for os_version in matrix.get("os-version", []):
                  for cuda_version in matrix.get("cuda-version", []):
                      image = f"nvidia/cuda:{cuda_version}-{os_version}"
                      if image not in images:
                          images.append(image)

          for image in images:
              print(image)
          PY

          while IFS= read -r image; do
            [[ -n "${image}" ]] || continue
            docker pull "${image}"
          done </tmp/manual-matrix-images.txt

  seed-ccache:
    name: Seed ccache (manual matrix)
    if: ${{ inputs.seed-ccache-before-matrix && inputs.enable-ccache && inputs.import-ccache-bundle-path == '' }}
    needs: [prepare, prefetch-images]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.seed_matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      docker-image: nvidia/cuda:${{ matrix.cuda-version }}-${{ matrix.os-version }}
      python-version: ${{ matrix.python-version }}
      cuda-version: ${{ matrix.cuda-version }}
      torch-version: ${{ matrix.torch-version }}
      cxx11_abi: ${{ join(matrix.cxx11_abi_list, '_') }}
      cxx11_abi_list_json: ${{ toJSON(matrix.cxx11_abi_list) }}
      runner-labels-json: ${{ matrix.runner_labels_json || inputs.runner-labels-json }}
      run-wheel-tests: ${{ inputs.run-wheel-tests }}
      wheel-test-target: ${{ inputs.wheel-test-target }}
      enable-ccache: ${{ inputs.enable-ccache }}
      ccache-namespace: ${{ inputs.ccache-namespace }}
      ccache-bundle-artifact-name: ${{ matrix.ccache_bundle_artifact || '' }}
      ccache-restore-mode: ${{ inputs.ccache-restore-mode }}
      import-ccache-artifact: ${{ inputs.import-ccache-artifact }}
      import-ccache-bundle-path: ${{ inputs.import-ccache-bundle-path }}
      build-profile: ${{ inputs.build-profile }}
      build-max-jobs: ${{ inputs.build-max-jobs }}
      nvcc-threads: ${{ inputs.nvcc-threads }}
      nvcc-lineinfo: ${{ inputs.nvcc-lineinfo }}
      nvcc-resource-usage: ${{ inputs.nvcc-resource-usage != '' && inputs.nvcc-resource-usage || (!inputs.build-profile && '0') || '' }}
      nvcc-split-compile: ${{ inputs.nvcc-split-compile }}
      skip-nvcc-gen-dependencies: ${{ inputs.skip-nvcc-gen-dependencies }}
      release-version: ${{ needs.prepare.outputs.release_version }}
      upload-to-release: ${{ inputs.upload-to-release }}

  build-wheel:
    name: Build wheel (manual matrix)
    if: ${{ always() && needs.prepare.result == 'success' && needs.prefetch-images.result == 'success' && (needs.seed-ccache.result == 'success' || needs.seed-ccache.result == 'skipped') }}
    needs: [prepare, prefetch-images, seed-ccache]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # GitHub uses the resolved workflow input / repo variable here.
      # act may still ignore dynamic expressions in this field.
      max-parallel: ${{ fromJson(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJson((needs.seed-ccache.result == 'success' && needs.prepare.outputs.fanout_matrix) || needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      docker-image: nvidia/cuda:${{ matrix.cuda-version }}-${{ matrix.os-version }}
      python-version: ${{ matrix.python-version }}
      cuda-version: ${{ matrix.cuda-version }}
      torch-version: ${{ matrix.torch-version }}
      cxx11_abi: ${{ join(matrix.cxx11_abi_list, '_') }}
      cxx11_abi_list_json: ${{ toJSON(matrix.cxx11_abi_list) }}
      runner-labels-json: ${{ matrix.runner_labels_json || inputs.runner-labels-json }}
      run-wheel-tests: ${{ inputs.run-wheel-tests }}
      wheel-test-target: ${{ inputs.wheel-test-target }}
      enable-ccache: ${{ inputs.enable-ccache }}
      ccache-namespace: ${{ inputs.ccache-namespace }}
      ccache-bundle-artifact-name: ${{ matrix.ccache_bundle_artifact || '' }}
      ccache-restore-mode: ${{ inputs.ccache-restore-mode }}
      import-ccache-artifact: ${{ (inputs.seed-ccache-before-matrix && inputs.enable-ccache && inputs.import-ccache-bundle-path == '' && needs.seed-ccache.result == 'success') && matrix.seed_ccache_artifact || inputs.import-ccache-artifact }}
      import-ccache-bundle-path: ${{ inputs.import-ccache-bundle-path }}
      build-profile: ${{ inputs.build-profile }}
      build-max-jobs: ${{ inputs.build-max-jobs }}
      nvcc-threads: ${{ inputs.nvcc-threads }}
      nvcc-lineinfo: ${{ inputs.nvcc-lineinfo }}
      nvcc-resource-usage: ${{ inputs.nvcc-resource-usage != '' && inputs.nvcc-resource-usage || (!inputs.build-profile && '0') || '' }}
      nvcc-split-compile: ${{ inputs.nvcc-split-compile }}
      skip-nvcc-gen-dependencies: ${{ inputs.skip-nvcc-gen-dependencies }}
      release-version: ${{ needs.prepare.outputs.release_version }}
      upload-to-release: ${{ inputs.upload-to-release }}
