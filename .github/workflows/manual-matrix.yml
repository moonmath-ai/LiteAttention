# Manually trigger a matrix of wheel builds with customizable axes.
name: Manual Matrix Build

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Matrix preset"
        required: true
        default: "full"
        type: choice
        options:
          - custom
          - full
          - matrix-48
          - bleeding-edge
      python-versions:
        description: "Comma-separated Python versions (e.g. 3.9,3.10,3.11)"
        required: false
        default: "3.9,3.10,3.11,3.12,3.13"
        type: string
      cuda-versions:
        description: "Comma-separated CUDA versions (e.g. 12.4.1,12.8.1)"
        required: false
        default: "12.4.1,12.8.1,12.9.1,13.0.0,13.0.1,13.0.2,13.1.0,13.1.1"
        type: string
      torch-versions:
        description: "Comma-separated PyTorch versions (e.g. 2.4.0,2.7.1)"
        required: false
        default: "2.4.0,2.7.1,2.8.0,2.9.1,2.10.0"
        type: string
      cxx11-abi:
        description: "Comma-separated C++11 ABI flags (TRUE,FALSE)"
        required: false
        default: "FALSE,TRUE"
        type: string
      os-version:
        description: "Comma-separated CUDA image OS suffixes (e.g. devel-ubuntu22.04)"
        required: false
        default: "devel-ubuntu22.04"
        type: string
      runner-labels-json:
        description: "Runner labels JSON (e.g. [\"self-hosted\",\"Linux\"])"
        required: false
        default: "[\"self-hosted\",\"Linux\"]"
        type: string
      max-parallel:
        description: "Max concurrent wheel jobs (empty = repo/org variable or fallback)"
        required: false
        default: ""
        type: string
      run-wheel-tests:
        description: "Install built wheel and run lite_attention tests"
        required: false
        default: true
        type: boolean
      wheel-test-target:
        description: "Pytest target for wheel validation"
        required: false
        default: "hopper/tests/test_lite_attention.py"
        type: string
      enable-ccache:
        description: "Enable ccache restore/save and bundle artifact"
        required: false
        default: true
        type: boolean
      ccache-namespace:
        description: "Namespace segment for ccache keys"
        required: false
        default: "manual-matrix"
        type: string
      import-ccache-artifact:
        description: "Optional artifact name containing ccache-bundle.tar.zst to import before each build job"
        required: false
        default: ""
        type: string
      import-ccache-bundle-path:
        description: "Optional direct path to a ccache-bundle.tar.zst file (for local act/manual testing)"
        required: false
        default: ""
        type: string
      build-profile:
        description: "Enable detailed NVCC/Ninja profiling artifacts and summary"
        required: false
        default: false
        type: boolean
      build-max-jobs:
        description: "Optional override for MAX_JOBS in each wheel build"
        required: false
        default: ""
        type: string
      nvcc-threads:
        description: "Optional override for NVCC_THREADS in each wheel build"
        required: false
        default: ""
        type: string
      nvcc-lineinfo:
        description: "Optional override for LITE_ATTENTION_NVCC_LINEINFO"
        required: false
        default: ""
        type: string
      nvcc-resource-usage:
        description: "Optional override for LITE_ATTENTION_NVCC_RESOURCE_USAGE"
        required: false
        default: ""
        type: string
      nvcc-split-compile:
        description: "Optional override for LITE_ATTENTION_NVCC_SPLIT_COMPILE"
        required: false
        default: ""
        type: string
      skip-nvcc-gen-dependencies:
        description: "Optional override for LITE_ATTENTION_SKIP_NVCC_GEN_DEPENDENCIES"
        required: false
        default: ""
        type: string
      matrix-json:
        description: "Optional JSON matrix object (overrides axis inputs)"
        required: false
        default: ""
        type: string
        # Example (single bleeding-edge wheel):
        # {"include":[{"os-version":"devel-ubuntu22.04","python-version":"3.12","cuda-version":"13.1.1","torch-version":"2.10.0","cxx11_abi":"FALSE"}]}
      upload-to-release:
        description: "Upload wheels to a release"
        required: false
        default: false
        type: boolean
      release-tag:
        description: "Release tag to upload to (required if upload-to-release is true)"
        required: false
        type: string

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      release_version: ${{ steps.set.outputs.release_version }}
      max_parallel: ${{ steps.set.outputs.max_parallel }}
    steps:
      - name: Checkout Repository
        if: ${{ !env.ACT }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set matrix and release version
        id: set
        run: |
          if [[ "${{ inputs.upload-to-release }}" == "true" && -z "${{ inputs.release-tag }}" ]]; then
            echo "::error::release-tag is required when upload-to-release is true"
            exit 1
          fi
          if [[ -n "${MATRIX_JSON_INPUT}" ]]; then
            raw_matrix="${MATRIX_JSON_INPUT}"
          else
            raw_matrix="$(env -u GITHUB_OUTPUT python3 .github/scripts/generate_wheel_matrix.py)"
          fi
          grouped_matrix="$(RAW_MATRIX="$raw_matrix" python3 - <<'PY'
          import itertools
          import json
          import os

          GROUP_KEYS = ("os-version", "python-version", "cuda-version", "torch-version")
          ABI_KEYS = {"cxx11_abi", "cxx11_abi_list"}

          matrix = json.loads(os.environ["RAW_MATRIX"])

          if "include" in matrix:
              entries = matrix["include"]
          else:
              axes = {
                  "os-version": matrix.get("os-version", []),
                  "python-version": matrix.get("python-version", []),
                  "cuda-version": matrix.get("cuda-version", []),
                  "torch-version": matrix.get("torch-version", []),
                  "cxx11_abi": matrix.get("cxx11_abi", []),
              }
              entries = [
                  {
                      "os-version": os_version,
                      "python-version": python_version,
                      "cuda-version": cuda_version,
                      "torch-version": torch_version,
                      "cxx11_abi": cxx11_abi,
                  }
                  for os_version, python_version, cuda_version, torch_version, cxx11_abi
                  in itertools.product(
                      axes["os-version"],
                      axes["python-version"],
                      axes["cuda-version"],
                      axes["torch-version"],
                      axes["cxx11_abi"],
                  )
              ]

          grouped = {}
          abi_order = {"FALSE": 0, "TRUE": 1}
          for entry in entries:
              key = tuple(entry[k] for k in GROUP_KEYS)
              grouped_entry = grouped.setdefault(
                  key,
                  {
                      **{k: v for k, v in entry.items() if k not in ABI_KEYS},
                      "cxx11_abi_list": [],
                  },
              )
              for extra_key, extra_value in entry.items():
                  if extra_key in ABI_KEYS:
                      continue
                  if extra_key not in grouped_entry:
                      grouped_entry[extra_key] = extra_value
                  elif grouped_entry[extra_key] != extra_value:
                      raise SystemExit(
                          f"Cannot batch entries with conflicting '{extra_key}' values for tuple {key}: "
                          f"{grouped_entry[extra_key]!r} vs {extra_value!r}"
                      )
              abi_values = entry.get("cxx11_abi_list")
              if abi_values is None:
                  abi_values = [entry["cxx11_abi"]]
              for abi in abi_values:
                  abi = str(abi)
                  if abi not in grouped_entry["cxx11_abi_list"]:
                      grouped_entry["cxx11_abi_list"].append(abi)

          include = list(grouped.values())
          for entry in include:
              entry["cxx11_abi_list"].sort(key=lambda abi: (abi_order.get(abi, 99), abi))

          print(json.dumps({"include": include}, separators=(",", ":")))
          PY
          )"
          echo "matrix=${grouped_matrix}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.upload-to-release }}" == "true" ]]; then
            echo "release_version=${{ inputs.release-tag }}" >> $GITHUB_OUTPUT
          else
            echo "release_version=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi
          max_parallel="${{ inputs.max-parallel }}"
          if [[ -z "$max_parallel" ]]; then
            max_parallel="${{ vars.LITE_ATTENTION_WHEEL_MATRIX_MAX_PARALLEL }}"
          fi
          if [[ -z "$max_parallel" ]]; then
            max_parallel="6"
          fi
          if ! [[ "$max_parallel" =~ ^[0-9]+$ ]] || (( max_parallel < 1 )); then
            echo "::error::max-parallel must be a positive integer (got '$max_parallel')"
            exit 1
          fi
          echo "max_parallel=$max_parallel" >> "$GITHUB_OUTPUT"
        env:
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          CUDA_VERSIONS: ${{ inputs.cuda-versions }}
          TORCH_VERSIONS: ${{ inputs.torch-versions }}
          CXX11_ABI: ${{ inputs.cxx11-abi }}
          OS_VERSION: ${{ inputs.os-version }}
          PRESET: ${{ inputs.preset }}
          MATRIX_JSON_INPUT: ${{ inputs.matrix-json }}

  prefetch-images:
    name: Prefetch docker images
    needs: prepare
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    steps:
      - name: Pull unique matrix images
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        run: |
          python3 - <<'PY' >/tmp/manual-matrix-images.txt
          import json
          import os

          matrix = json.loads(os.environ["MATRIX_JSON"])
          images = []

          if "include" in matrix:
              for entry in matrix["include"]:
                  image = f"nvidia/cuda:{entry['cuda-version']}-{entry['os-version']}"
                  if image not in images:
                      images.append(image)
          else:
              for os_version in matrix.get("os-version", []):
                  for cuda_version in matrix.get("cuda-version", []):
                      image = f"nvidia/cuda:{cuda_version}-{os_version}"
                      if image not in images:
                          images.append(image)

          for image in images:
              print(image)
          PY

          while IFS= read -r image; do
            [[ -n "${image}" ]] || continue
            docker pull "${image}"
          done </tmp/manual-matrix-images.txt

  build-wheel:
    name: Build wheel (manual matrix)
    needs: [prepare, prefetch-images]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # GitHub uses the resolved workflow input / repo variable here.
      # act may still ignore dynamic expressions in this field.
      max-parallel: ${{ fromJson(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      docker-image: nvidia/cuda:${{ matrix.cuda-version }}-${{ matrix.os-version }}
      python-version: ${{ matrix.python-version }}
      cuda-version: ${{ matrix.cuda-version }}
      torch-version: ${{ matrix.torch-version }}
      cxx11_abi: ${{ join(matrix.cxx11_abi_list, '_') }}
      cxx11_abi_list_json: ${{ toJSON(matrix.cxx11_abi_list) }}
      runner-labels-json: ${{ inputs.runner-labels-json }}
      run-wheel-tests: ${{ inputs.run-wheel-tests }}
      wheel-test-target: ${{ inputs.wheel-test-target }}
      enable-ccache: ${{ inputs.enable-ccache }}
      ccache-namespace: ${{ inputs.ccache-namespace }}
      import-ccache-artifact: ${{ inputs.import-ccache-artifact }}
      import-ccache-bundle-path: ${{ inputs.import-ccache-bundle-path }}
      build-profile: ${{ inputs.build-profile }}
      build-max-jobs: ${{ inputs.build-max-jobs }}
      nvcc-threads: ${{ inputs.nvcc-threads }}
      nvcc-lineinfo: ${{ inputs.nvcc-lineinfo }}
      nvcc-resource-usage: ${{ inputs.nvcc-resource-usage }}
      nvcc-split-compile: ${{ inputs.nvcc-split-compile }}
      skip-nvcc-gen-dependencies: ${{ inputs.skip-nvcc-gen-dependencies }}
      release-version: ${{ needs.prepare.outputs.release_version }}
      upload-to-release: ${{ inputs.upload-to-release }}
