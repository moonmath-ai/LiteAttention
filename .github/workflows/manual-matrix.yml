# Manually trigger a matrix of wheel builds with customizable axes.
name: Manual Matrix Build

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Matrix preset"
        required: true
        default: "full"
        type: choice
        options:
          - custom
          - full
          - matrix-48
          - bleeding-edge
      python-versions:
        description: "Comma-separated Python versions (e.g. 3.9,3.10,3.11)"
        required: false
        default: "3.9,3.10,3.11,3.12,3.13"
        type: string
      cuda-versions:
        description: "Comma-separated CUDA versions (e.g. 12.4.1,12.8.1)"
        required: false
        default: "12.4.1,12.8.1,12.9.1,13.0.0,13.0.1,13.0.2,13.1.0,13.1.1"
        type: string
      torch-versions:
        description: "Comma-separated PyTorch versions (e.g. 2.4.0,2.7.1)"
        required: false
        default: "2.4.0,2.7.1,2.8.0,2.9.1,2.10.0"
        type: string
      cxx11-abi:
        description: "Comma-separated C++11 ABI flags (TRUE,FALSE)"
        required: false
        default: "FALSE,TRUE"
        type: string
      os-version:
        description: "Comma-separated CUDA image OS suffixes (e.g. devel-ubuntu22.04)"
        required: false
        default: "devel-ubuntu22.04"
        type: string
      runner-labels-json:
        description: "Runner labels JSON (e.g. [\"self-hosted\",\"Linux\"])"
        required: false
        default: "[\"self-hosted\",\"Linux\"]"
        type: string
      run-wheel-tests:
        description: "Install built wheel and run lite_attention tests"
        required: false
        default: true
        type: boolean
      wheel-test-target:
        description: "Pytest target for wheel validation"
        required: false
        default: "hopper/tests/test_lite_attention.py"
        type: string
      enable-ccache:
        description: "Enable ccache restore/save and bundle artifact"
        required: false
        default: true
        type: boolean
      ccache-namespace:
        description: "Namespace segment for ccache keys"
        required: false
        default: "manual-matrix"
        type: string
      matrix-json:
        description: "Optional JSON matrix object (overrides axis inputs)"
        required: false
        default: ""
        type: string
        # Example (single bleeding-edge wheel):
        # {"include":[{"os-version":"devel-ubuntu22.04","python-version":"3.12","cuda-version":"13.1.1","torch-version":"2.10.0","cxx11_abi":"FALSE"}]}
      upload-to-release:
        description: "Upload wheels to a release"
        required: false
        default: false
        type: boolean
      release-tag:
        description: "Release tag to upload to (required if upload-to-release is true)"
        required: false
        type: string

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ${{ fromJSON(inputs.runner-labels-json) }}
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      release_version: ${{ steps.set.outputs.release_version }}
    steps:
      - name: Checkout Repository
        if: ${{ !env.ACT }}
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set matrix and release version
        id: set
        run: |
          if [[ "${{ inputs.upload-to-release }}" == "true" && -z "${{ inputs.release-tag }}" ]]; then
            echo "::error::release-tag is required when upload-to-release is true"
            exit 1
          fi
          if [[ -n "${{ inputs.matrix-json }}" ]]; then
            echo "matrix=${{ inputs.matrix-json }}" >> $GITHUB_OUTPUT
          else
            python3 .github/scripts/generate_wheel_matrix.py
          fi
          if [[ "${{ inputs.upload-to-release }}" == "true" ]]; then
            echo "release_version=${{ inputs.release-tag }}" >> $GITHUB_OUTPUT
          else
            echo "release_version=${{ github.ref }}" >> $GITHUB_OUTPUT
          fi
        env:
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          CUDA_VERSIONS: ${{ inputs.cuda-versions }}
          TORCH_VERSIONS: ${{ inputs.torch-versions }}
          CXX11_ABI: ${{ inputs.cxx11-abi }}
          OS_VERSION: ${{ inputs.os-version }}
          PRESET: ${{ inputs.preset }}

  build-wheel:
    name: Build wheel (manual matrix)
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_build.yml
    with:
      docker-image: nvidia/cuda:${{ matrix.cuda-version }}-${{ matrix.os-version }}
      python-version: ${{ matrix.python-version }}
      cuda-version: ${{ matrix.cuda-version }}
      torch-version: ${{ matrix.torch-version }}
      cxx11_abi: ${{ matrix.cxx11_abi }}
      runner-labels-json: ${{ inputs.runner-labels-json }}
      run-wheel-tests: ${{ inputs.run-wheel-tests }}
      wheel-test-target: ${{ inputs.wheel-test-target }}
      enable-ccache: ${{ inputs.enable-ccache }}
      ccache-namespace: ${{ inputs.ccache-namespace }}
      release-version: ${{ needs.prepare.outputs.release_version }}
      upload-to-release: ${{ inputs.upload-to-release }}
