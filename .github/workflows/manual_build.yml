name: Manual Build

on:
  workflow_dispatch:
    inputs:
      docker-image:
        description: "Docker image to use"
        required: true
        default: "ubuntu:22.04"
        type: choice
        options:
          - "ubuntu:22.04"
          - "ubuntu:24.04"
      python-version:
        description: "Python version"
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      torch-version:
        description: "PyTorch version"
        required: true
        default: "2.9.1"
        type: choice
        options:
          - "2.5.1"
          - "2.6.0"
          - "2.7.1"
          - "2.8.0"
          - "2.9.1"
          - "2.10.0.dev20251108"
      cuda-version:
        description: "CUDA version"
        required: true
        default: "12.9.1"
        type: choice
        options:
          - "12.9.1"
          - "13.0.2"
      cxx11_abi:
        description: "C++11 ABI"
        required: true
        default: "FALSE"
        type: choice
        options:
          - "FALSE"
          - "TRUE"

jobs:
  build_wheel:
    name: Build Wheel (Manual)
    uses: ./.github/workflows/_build.yml
    with:
      docker-image: ${{ inputs.docker-image }}
      python-version: ${{ inputs.python-version }}
      cuda-version: ${{ inputs.cuda-version }}
      torch-version: ${{ inputs.torch-version }}
      cxx11_abi: ${{ inputs.cxx11_abi }}
      upload-to-release: false

